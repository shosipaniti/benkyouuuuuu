      function makeImportedId(fileName, index) {
        const base = fileName
          .replace(/\.[^.]+$/, "")
          .replace(/[^\p{L}\p{N}]+/gu, "-")
          .replace(/^-|-$/g, "")
          .toLowerCase() || "import";
        return `import-${base}-${Date.now()}-${index + 1}`;
      }

      function splitList(value) {
        if (Array.isArray(value)) return value.map((item) => String(item).trim()).filter(Boolean);
        return String(value || "")
          .split(/\s*(?:\/|\||、|,)\s*/)
          .map((item) => item.trim())
          .filter(Boolean);
      }

      function questionFromRow(row, index, fileName, category) {
        const prompt = row.prompt || row.question || row.問題 || row.問題文 || row.q || "";
        const answer = row.answer || row.正解 || row.答え || row.a || "";
        const explanation = row.explanation || row.解説 || row.理由 || "";
        const choices = row.choices || row.選択肢 || row.options || "";
        const images = row.images || row.画像 || "";
        const type = row.type || row.形式 || (choices ? "single" : "text");

        return normalize([{
          id: row.id || makeImportedId(fileName, index),
          source: row.source || row.範囲 || row.出典 || fileName.replace(/\.[^.]+$/, ""),
          category: row.category || category,
          number: Number(row.number || row.番号 || index + 1),
          prompt,
          answer,
          explanation,
          type,
          choices: splitList(choices),
          images: splitList(images)
        }], category)[0];
      }

      function parseCsv(text) {
        const rows = [];
        let current = "";
        let row = [];
        let quoted = false;

        for (let i = 0; i < text.length; i += 1) {
          const char = text[i];
          const next = text[i + 1];

          if (char === '"' && quoted && next === '"') {
            current += '"';
            i += 1;
          } else if (char === '"') {
            quoted = !quoted;
          } else if (char === "," && !quoted) {
            row.push(current);
            current = "";
          } else if ((char === "\n" || char === "\r") && !quoted) {
            if (char === "\r" && next === "\n") i += 1;
            row.push(current);
            if (row.some((cell) => cell.trim())) rows.push(row);
            row = [];
            current = "";
          } else {
            current += char;
          }
        }

        row.push(current);
        if (row.some((cell) => cell.trim())) rows.push(row);
        return rows;
      }

      function parseCsvQuestions(text, fileName, category) {
        const rows = parseCsv(text);
        if (rows.length < 2) return [];
        const headers = rows[0].map((header) => header.trim());
        return rows.slice(1).map((cells, index) => {
          const row = {};
          headers.forEach((header, cellIndex) => {
            row[header] = cells[cellIndex] || "";
          });
          return questionFromRow(row, index, fileName, category);
        });
      }

      function parseMarkdownTableQuestions(text, fileName, category) {
        const tableRows = text
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter((line) => line.startsWith("|") && line.endsWith("|"))
          .map((line) => line.slice(1, -1).split("|").map((cell) => cell.trim()));

        if (tableRows.length < 2) return [];
        const headers = tableRows[0];
        const body = tableRows.slice(1).filter((row) => !row.every((cell) => /^:?-{3,}:?$/.test(cell)));
        return body.map((cells, index) => {
          const row = {};
          headers.forEach((header, cellIndex) => {
            row[header] = cells[cellIndex] || "";
          });
          return questionFromRow(row, index, fileName, category);
        });
      }

      function stripHtml(text) {
        return text
          .replace(/<script[\s\S]*?<\/script>/gi, " ")
          .replace(/<style[\s\S]*?<\/style>/gi, " ")
          .replace(/<br\s*\/?>/gi, "\n")
          .replace(/<\/p>|<\/div>|<\/li>|<\/h[1-6]>/gi, "\n")
          .replace(/<[^>]+>/g, " ")
          .replace(/&nbsp;/g, " ")
          .replace(/&amp;/g, "&")
          .replace(/&lt;/g, "<")
          .replace(/&gt;/g, ">")
          .replace(/\n{3,}/g, "\n\n");
      }

      function parseQaTextQuestions(text, fileName, category) {
        const source = fileName.replace(/\.[^.]+$/, "");
        const blocks = text.split(/\n\s*\n/).map((block) => block.trim()).filter(Boolean);
        const questions = [];

        blocks.forEach((block) => {
          const qMatch = block.match(/(?:^|\n)\s*(?:Q|問題|問)[:：]\s*([\s\S]*?)(?=\n\s*(?:A|答え|解答|正解)[:：]|$)/i);
          const aMatch = block.match(/(?:^|\n)\s*(?:A|答え|解答|正解)[:：]\s*([\s\S]*)/i);
          if (qMatch && aMatch) {
            questions.push({
              prompt: qMatch[1].trim(),
              answer: aMatch[1].trim(),
              type: "text",
              choices: []
            });
          }
        });

        if (!questions.length) {
          text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean).forEach((line) => {
            const blank = line.match(/(.+?)[（(]\s*([^)）]+)\s*[)）](.*)/);
            if (blank) {
              questions.push({
                prompt: `${blank[1]}（　）${blank[3]}`,
                answer: blank[2],
                type: "text",
                choices: []
              });
            }
          });
        }

        return questions.map((question, index) => normalize([{
          id: makeImportedId(fileName, index),
          source,
          category,
          number: index + 1,
          images: [],
          ...question
        }], category)[0]);
      }

      function normalizeSlideText(text) {
        return stripHtml(text)
          .replace(/[ \t]+/g, " ")
          .replace(/\n{3,}/g, "\n\n")
          .trim();
      }

      function isUsefulSlideLine(line) {
        const cleaned = line.trim();
        if (cleaned.length < 5) return false;
        if (/^\d+$/.test(cleaned)) return false;
        if (/^(http|www\.)/i.test(cleaned)) return false;
        if (/^(第\d+回|授業|講義|スライド|page|p\.)\s*\d*$/i.test(cleaned)) return false;
        return true;
      }

      function extractKeyTerm(line) {
        const definitionPatterns = [
          /^(.{2,24}?)(?:とは|とは、|とは:|とは：)/,
          /^(.{2,24}?)(?:は|：|:)\s*(?:[^。]{6,})$/,
          /「([^」]{2,24})」/,
          /『([^』]{2,24})』/
        ];

        for (const pattern of definitionPatterns) {
          const match = line.match(pattern);
          if (match) return match[1].replace(/[「」『』()（）]/g, "").trim();
        }

        const bracket = line.match(/[（(]([^（）()]{2,24})[)）]/);
        if (bracket) return bracket[1].trim();

        return "";
      }

      function uniqueQuestions(questions) {
        const seen = new Set();
        return questions.filter((question) => {
          const key = `${question.prompt}|${question.answer}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }

      function decodePdfBytesBestEffort(bytes) {
        const data = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
        if (data[0] === 0xfe && data[1] === 0xff) {
          let output = "";
          for (let i = 2; i < data.length; i += 2) output += String.fromCharCode((data[i] << 8) | (data[i + 1] || 0));
          return output;
        }
        try {
          return new TextDecoder("utf-8", { fatal: true }).decode(data);
        } catch {
          return new TextDecoder("latin1").decode(data);
        }
      }

      function pdfBinaryString(bytes) {
        const chunks = [];
        const size = 8192;
        for (let i = 0; i < bytes.length; i += size) {
          chunks.push(String.fromCharCode(...bytes.slice(i, i + size)));
        }
        return chunks.join("");
      }

      function decodePdfLiteral(value) {
        const output = [];
        for (let i = 0; i < value.length; i += 1) {
          const char = value[i];
          if (char !== "\\") {
            output.push(char.charCodeAt(0) & 0xff);
            continue;
          }

          const next = value[i + 1];
          if (next === "n") output.push(10);
          else if (next === "r") output.push(13);
          else if (next === "t") output.push(9);
          else if (next === "b") output.push(8);
          else if (next === "f") output.push(12);
          else if (next === "(" || next === ")" || next === "\\") output.push(next.charCodeAt(0));
          else if (/[0-7]/.test(next || "")) {
            const octal = value.slice(i + 1, i + 4).match(/^[0-7]{1,3}/)?.[0] || "";
            output.push(parseInt(octal, 8));
            i += octal.length - 1;
          }
          i += 1;
        }
        return decodePdfBytesBestEffort(output);
      }

      function decodePdfHex(value) {
        const compact = value.replace(/\s+/g, "");
        if (!compact) return "";
        const bytes = [];
        for (let i = 0; i < compact.length; i += 2) {
          bytes.push(parseInt(compact.slice(i, i + 2).padEnd(2, "0"), 16));
        }
        return decodePdfBytesBestEffort(bytes);
      }

      async function inflatePdfStream(bytes) {
        if (!("DecompressionStream" in window)) return "";
        try {
          const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
          return await new Response(stream).text();
        } catch {
          return "";
        }
      }

      function extractPdfTextFromStream(text) {
        const parts = [];
        const literal = /((?:\((?:\\.|[^\\()])*\)\s*)+)(?:Tj|'|")/g;
        let match;
        while ((match = literal.exec(text))) {
          const strings = [...match[1].matchAll(/\((?:\\.|[^\\()])*\)/g)].map((item) => decodePdfLiteral(item[0].slice(1, -1)));
          if (strings.length) parts.push(strings.join(""));
        }

        const array = /\[([\s\S]*?)\]\s*TJ/g;
        while ((match = array.exec(text))) {
          const strings = [];
          const body = match[1];
          for (const item of body.matchAll(/\((?:\\.|[^\\()])*\)|<([0-9A-Fa-f\s]+)>/g)) {
            strings.push(item[0][0] === "(" ? decodePdfLiteral(item[0].slice(1, -1)) : decodePdfHex(item[1]));
          }
          if (strings.length) parts.push(strings.join(""));
        }

        const hex = /<([0-9A-Fa-f\s]{4,})>\s*Tj/g;
        while ((match = hex.exec(text))) {
          const decoded = decodePdfHex(match[1]);
          if (decoded.trim()) parts.push(decoded);
        }

        return parts.join("\n");
      }

      function readablePdfText(text) {
        return text
          .replace(/\u0000/g, "")
          .replace(/[^\S\r\n]+/g, " ")
          .replace(/\n{3,}/g, "\n\n")
          .trim();
      }

      async function extractPdfText(file) {
        const buffer = await file.arrayBuffer();
        const bytes = new Uint8Array(buffer);
        const raw = pdfBinaryString(bytes);
        const parts = [];
        const streamPattern = /<<(.*?)>>\s*stream\r?\n?([\s\S]*?)\r?\n?endstream/g;
        let match;

        while ((match = streamPattern.exec(raw))) {
          const dictionary = match[1];
          const body = match[2].replace(/^\r?\n/, "").replace(/\r?\n$/, "");
          let streamText = body;

          if (/FlateDecode/.test(dictionary)) {
            const streamBytes = Uint8Array.from(body, (char) => char.charCodeAt(0) & 0xff);
            streamText = await inflatePdfStream(streamBytes);
            if (!streamText) continue;
          }

          const extracted = extractPdfTextFromStream(streamText);
          if (extracted.trim()) parts.push(extracted);
        }

        if (!parts.length) {
          const fallback = extractPdfTextFromStream(raw);
          if (fallback.trim()) parts.push(fallback);
        }

        const text = readablePdfText(parts.join("\n"));
        if (text.replace(/\s/g, "").length < 20) {
          throw new Error(`${file.name}: PDFから本文を抽出できませんでした。画像だけのPDFか、特殊な文字埋め込みの可能性があります。本文をコピーして貼り付けてください。`);
        }
        return text;
      }

      function parseSlideQuestions(text, fileName) {
        const source = fileName.replace(/\.[^.]+$/, "");
        const cleaned = normalizeSlideText(text);
        const lines = cleaned.split(/\r?\n/).map((line) => line.trim()).filter(isUsefulSlideLine);
        const questions = [];

        lines.forEach((line) => {
          const blankMatches = [...line.matchAll(/[（(]([^（）()]{2,30})[)）]/g)];
          blankMatches.forEach((match) => {
            const answer = match[1].trim();
            if (!answer || /上昇|下落|増加|減少|右|左/.test(answer) && line.length < 10) return;
            questions.push({
              prompt: line.replace(match[0], "（　）"),
              answer,
              type: "text",
              choices: []
            });
          });

          const term = extractKeyTerm(line);
          if (term && line.length >= 12) {
            questions.push({
              prompt: `次の説明に当てはまる語句を答えなさい。\n${line.replace(term, "（　）")}`,
              answer: term,
              type: "text",
              choices: []
            });
          }
        });

        const compactLines = lines.filter((line) => line.length >= 8 && line.length <= 70);
        compactLines.slice(0, 20).forEach((line) => {
          const term = extractKeyTerm(line);
          if (!term) return;
          questions.push({
            prompt: `${term}について、最も近い説明を選びなさい。`,
            answer: line,
            type: "single",
            choices: uniqueQuestions([line, ...compactLines.filter((item) => item !== line).slice(0, 3)].map((choice, index) => ({
              prompt: String(index),
              answer: choice
            }))).map((item) => item.answer)
          });
        });

        return uniqueQuestions(questions).map((question, index) => normalize([{
          id: makeImportedId(fileName, index),
          source: `予想 ${source}`,
          category: "prediction",
          number: index + 1,
          images: [],
          ...question
        }], "prediction")[0]);
      }

      function extractArrayFromJs(text, name) {
        const marker = `window.${name}`;
        const start = text.indexOf(marker);
        if (start === -1) return null;
        const eq = text.indexOf("=", start);
        const arrayStart = text.indexOf("[", eq);
        if (eq === -1 || arrayStart === -1) return null;

        let depth = 0;
        let inString = false;
        let quote = "";
        let escaped = false;

        for (let i = arrayStart; i < text.length; i += 1) {
          const char = text[i];
          if (inString) {
            if (escaped) escaped = false;
            else if (char === "\\") escaped = true;
            else if (char === quote) inString = false;
          } else if (char === '"' || char === "'") {
            inString = true;
            quote = char;
          } else if (char === "[") {
            depth += 1;
          } else if (char === "]") {
            depth -= 1;
            if (depth === 0) return text.slice(arrayStart, i + 1);
          }
        }

        return null;
      }

      function categoryForFileKind(fileKind, selectedCategory) {
        if (fileKind === "quiz") return "quiz";
        if (fileKind === "slides") return "prediction";
        return selectedCategory;
      }

      function parseQuestionFile(text, fileName, category, fileKind) {
        const lower = fileName.toLowerCase();
        const cleanedText = lower.endsWith(".html") || lower.endsWith(".htm") ? stripHtml(text) : text;
        const resolvedCategory = categoryForFileKind(fileKind, category);

        if (fileKind === "slides") {
          return parseSlideQuestions(cleanedText, fileName);
        }

        if (lower.endsWith(".json")) {
          const parsed = JSON.parse(text);
          const items = Array.isArray(parsed) ? parsed : parsed.questions || parsed.data || [];
          return normalize(items, resolvedCategory);
        }

        if (lower.endsWith(".js")) {
          const arrayText = extractArrayFromJs(text, "QUESTION_DATA") || extractArrayFromJs(text, "PREDICTED_QUESTION_DATA");
          if (!arrayText) return [];
          return normalize(JSON.parse(arrayText), resolvedCategory);
        }

        if (lower.endsWith(".csv")) return parseCsvQuestions(text, fileName, resolvedCategory);

        const tableQuestions = parseMarkdownTableQuestions(cleanedText, fileName, resolvedCategory);
        if (tableQuestions.length) return tableQuestions;

        return parseQaTextQuestions(cleanedText, fileName, resolvedCategory);
      }

      async function parseUploadedFile(file, category, fileKind) {
        const lower = file.name.toLowerCase();
        if (lower.endsWith(".pdf") || file.type === "application/pdf") {
          const text = await extractPdfText(file);
          return parseQuestionFile(text, file.name.replace(/\.pdf$/i, ".txt"), category, fileKind);
        }
        return parseQuestionFile(await file.text(), file.name, category, fileKind);
      }

      function addImportedQuestions(questions, label, fileKind = el.fileKind.value) {
        const category = categoryForFileKind(fileKind, el.importCategory.value);
        const normalized = normalize(questions, category)
          .filter((question) => String(question.prompt).trim() && String(question.answer).trim());

        if (!normalized.length) {
          el.importStatus.textContent = `${label}: 追加できる問題が見つかりませんでした。PDFの場合はテキスト層があるか確認するか、本文をコピーして貼り付けてください。`;
          return;
        }

        importedQuestions = [...importedQuestions, ...normalized];
        saveImportedQuestions();
        refreshQuestionData();
        archivedSets.delete(category);
        saveArchivedSets();
        state.activeSet = category;
        saveActiveSet();
        state.category = "all";
        state.source = "all";
        state.type = "all";
        state.status = "all";
        state.query = "";
        el.searchInput.value = "";
        state.setChooserOpen = false;
        state.index = 0;
        state.revealed = false;
        el.importStatus.textContent = `${label}: ${normalized.length}問を${categoryLabels[category]}に追加しました。`;
        render();
      }

      async function importFiles(files) {
        let added = [];
        for (const file of files) {
          added = [...added, ...await parseUploadedFile(file, el.importCategory.value, el.fileKind.value)];
        }
        addImportedQuestions(added, `${files.length}ファイル`, el.fileKind.value);
        el.fileInput.value = "";
      }

      function parseMatchingAnswer(answer) {
        return String(answer)
          .split("/")
          .map((part) => part.trim())
          .filter(Boolean)
          .map((part) => {
            const [label, value] = part.split("=").map((item) => item.trim());
            return { label, value };
          });
      }

      function parseChoice(choice) {
        const match = String(choice).match(/^([^:]+):\s*(.*)$/);
        return match ? { key: match[1], label: match[2] } : { key: choice, label: choice };
      }

      function validate(questions) {
        const issues = [];
        const ids = new Set();

        questions.forEach((question, index) => {
          const label = question.id || `${index + 1}問目`;

          if (!question.id) issues.push(`${label}: id が空です。`);
          if (ids.has(question.id)) issues.push(`${label}: id が重複しています。`);
          ids.add(question.id);
          if (!String(question.prompt).trim()) issues.push(`${label}: prompt が空です。`);
          if (!String(question.answer).trim()) issues.push(`${label}: answer が空です。`);
          if (!supportedTypes.includes(question.type)) issues.push(`${label}: type が未対応です。`);
          if ((question.type === "single" || question.type === "multiple") && !question.choices.length) {
            issues.push(`${label}: ${question.type} には choices が必要です。`);
          }
          if (question.type === "matching") {
            const pairs = parseMatchingAnswer(question.answer);
            if (!pairs.length || pairs.some((pair) => !pair.label || !pair.value)) {
              issues.push(`${label}: matching の answer は「① = 用語 / ② = 用語」形式にしてください。`);
            }
          }
          question.images.forEach((src) => {
            if (!src || typeof src !== "string") issues.push(`${label}: images に空の値があります。`);
          });
        });

        return issues;
      }

      function getResponse(question) {
        if (!state.responses[question.id]) {
          state.responses[question.id] = { selected: [], matching: {}, text: "", checked: false, correct: false };
        }
        return state.responses[question.id];
      }

      function shuffled(items) {
        const result = [...items];
        for (let i = result.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
      }

      function randomizedChoices(question, response) {
        const signature = question.choices.join("\u0001");
        if (response.choiceOrderSignature !== signature || !Array.isArray(response.choiceOrder)) {
          response.choiceOrderSignature = signature;
          response.choiceOrder = shuffled(question.choices);
        }
        return response.choiceOrder;
      }

      function resetChoiceOrder(question) {
        if (!question || !state.responses[question.id]) return;
        delete state.responses[question.id].choiceOrderSignature;
        delete state.responses[question.id].choiceOrder;
      }

      function normalizeAnswer(value) {
        return String(value).trim().replace(/\s+/g, "").toLowerCase();
      }

      function correctValues(question) {
        if (question.type === "multiple") return String(question.answer).split("/").map((item) => item.trim()).filter(Boolean);
        return [String(question.answer).trim()];
      }

      function sameSet(a, b) {
        return a.length === b.length && a.every((item) => b.includes(item));
      }

      function canCheckAnswer(question) {
        const response = getResponse(question);
        if (question.type === "single" || question.type === "multiple") return response.selected.length > 0;
        if (question.type === "matching") {
          return parseMatchingAnswer(question.answer).every((pair) => response.matching[pair.label]);
        }
        return question.type === "text" || question.type === "free";
      }

      function displayPrompt(question) {
        const prompt = String(question.prompt || "");
        if (question.type !== "multiple") return prompt;
        const guidance = "当てはまるものを全て答えなさい。";
        if (prompt.includes("全て答えなさい")) return prompt;
        if (prompt.includes("すべて選びなさい")) {
          return prompt.replace(/すべて選びなさい。?/g, guidance).replace(/すべて選びなさい/g, guidance);
        }
        return `${prompt}\n${guidance}`;
      }

      function slideReferenceText(question) {
        if (question.slideReference) return question.slideReference;

        const source = String(question.source || "");
        const category = String(question.category || "");
        const prefixedRound = source.match(/第0?(\d+)回/);
        const economicsRound = source.match(/経済(\d+)/);
        const predictionRound = source.match(/^予想 第(\d+)回/);

        if (category === "audio-prediction" && prefixedRound) return `音声工学 第${Number(prefixedRound[1])}回スライド`;
        if (category === "audio") return "音声工学 第1回〜第6回スライド（中間範囲）・中間過去問";
        if (category === "audio-final") return "音声工学 期末過去問（2020年8月5日）";
        if (category === "audio-final-prediction" && prefixedRound) return `音声工学 第${Number(prefixedRound[1])}回スライド（期末範囲）`;
        if (category === "acoustics-final") return "音響工学 期末過去問（2021年度）・練習問題";
        if (category === "human-centered-final") return "人間中心設計 期末過去問（2021・2023年度）・プレテスト";
        if (category === "knowledge-prediction" && prefixedRound) return `知識工学 第${Number(prefixedRound[1])}回スライド`;
        if (category === "knowledge-quiz") return "知識工学 第1回〜第6回スライド（小テスト範囲）・小テスト";
        if (category === "knowledge-review") return "知識工学 第1回〜第6回スライド（中間範囲）・中間補強";
        if (category === "knowledge") return "知識工学 第1回〜第6回スライド（中間範囲）・中間過去問";
        if (category === "machine-learning-prediction") return "機械学習 第1回〜第5回スライド（中間範囲）・中間過去問";
        if (category === "machine-learning") return "機械学習 第1回〜第5回スライド（中間範囲）・中間過去問";
        if (category === "machine-learning-final") return "機械学習 期末過去問（2022年度）";
        if (category === "economics-final") return "経済学 期末範囲スライド・期末過去問";
        if ((category === "prediction" || category === "quiz" || !category) && predictionRound) return `経済学 第${Number(predictionRound[1])}回スライド`;
        if ((category === "quiz" || !category) && economicsRound) return `経済学 第${Number(economicsRound[1])}回スライド`;

        return source ? `${source} の授業資料` : "該当範囲の授業スライド";
      }

      function withSlideReference(text, question) {
        const reference = slideReferenceText(question);
        if (!reference) return text;
        if (String(text).includes("参照スライド")) return text;
        return `${text}\n参照スライド: ${reference}`;
      }

      function explanationText(question) {
        if (question.explanation) return withSlideReference(question.explanation, question);
        const prompt = String(question.prompt || "");
        const answer = String(question.answer || "");
        if (question.type === "free" || answer.includes("保存された解答なし")) {
          return withSlideReference("自由記述なので、授業内容の要点を自分の言葉で整理できれば大丈夫です。", question);
        }
        if (question.type === "matching") {
          return withSlideReference("問題文の項目と用語の対応を整理すると、この組み合わせになります。", question);
        }
        if (question.type === "multiple") {
          return withSlideReference("条件に当てはまる項目だけを残すと、答えにある選択肢の組み合わせになります。", question);
        }
        if (/計算|求め|代入|偏微分|行列|分散|平均|確率|最小|最大|係数|成分/.test(prompt)) {
          return withSlideReference("問題文の条件を式や定義に当てはめて計算すると、この答えになります。", question);
        }
        if (/何という|何と呼|何か|名称|用語|表記|定義/.test(prompt)) {
          return withSlideReference("その内容を表す授業内の用語・定義が、この答えです。", question);
        }
        if (question.type === "single") {
          return withSlideReference("選択肢の中で、問題文の説明や条件に合うものがこの答えです。", question);
        }
        return withSlideReference("問題文で問われている条件に対応する語句・値が、この答えです。", question);
      }

      function judge(question) {
        const response = getResponse(question);
        let correct = false;

        if (question.type === "free" || String(question.answer).includes("保存された解答なし")) {
          response.checked = true;
          response.correct = null;
          render();
          return;
        }

        if (question.type === "matching") {
          correct = parseMatchingAnswer(question.answer).every((pair) => response.matching[pair.label] === pair.value);
        } else if (question.type === "multiple") {
          correct = sameSet(
            response.selected.map(normalizeAnswer).sort(),
            correctValues(question).map(normalizeAnswer).sort()
          );
        } else if (question.type === "text" || question.type === "free") {
          correct = normalizeAnswer(response.text) === normalizeAnswer(question.answer);
        } else {
          correct = normalizeAnswer(response.selected[0] || "") === normalizeAnswer(question.answer);
        }

        response.checked = true;
        response.correct = correct;
        state.progress[question.id] = correct ? "known" : "review";
        saveProgress();
        render();
      }

      function filtered() {
        const query = state.query.trim().toLowerCase();
        if (!state.activeSet) return [];
        return state.order
          .map((index) => allQuestions[index])
          .filter((question) => {
            const status = state.progress[question.id] || "new";
            const text = `${question.prompt} ${question.answer} ${question.source}`.toLowerCase();
            return question.category === state.activeSet
              && (state.category === "all" || question.category === state.category)
              && (state.source === "all" || question.source === state.source)
              && (state.type === "all" || question.type === state.type)
              && (state.status === "all" || status === state.status)
              && (!query || text.includes(query));
          });
      }

      function option(value, label) {
        const item = document.createElement("option");
        item.value = value;
        item.textContent = label;
        return item;
      }

      function unique(values) {
        return [...new Set(values)];
      }

      function setOptions(select, current, entries) {
        select.replaceChildren(...entries.map(([value, label]) => option(value, label)));
        select.value = current;
      }

      function categoryEntries() {
        const values = orderedCategories(unique(allQuestions.map((question) => question.category)));
        return values.map((category) => [category, categoryLabels[category] || category]);
      }

      function importCategoryEntries() {
        const values = orderedCategories(unique([...defaultCategoryOrder, ...allQuestions.map((question) => question.category)]));
        return values.map((category) => [category, categoryLabels[category] || category]);
      }

      function orderedCategories(values) {
        const target = unique(values.filter(Boolean));
        const order = unique([...categoryOrder, ...defaultCategoryOrder]);
        return [
          ...order.filter((category) => target.includes(category)),
          ...target
            .filter((category) => !order.includes(category))
            .sort((a, b) => (categoryLabels[a] || a).localeCompare(categoryLabels[b] || b, "ja"))
        ];
      }

      function resetDetailFilters() {
        state.category = "all";
        state.source = "all";
        state.type = "all";
        state.status = "all";
        state.query = "";
        el.searchInput.value = "";
      }

      function setStats(category) {
        const questions = categoryQuestions(category);
        const known = questions.filter((question) => state.progress[question.id] === "known").length;
        const review = questions.filter((question) => state.progress[question.id] === "review").length;
        return { total: questions.length, known, review, newCount: questions.length - known - review };
      }

      function activeCategories() {
        return categoryEntries()
          .map(([category, label]) => ({ category, label, ...setStats(category) }))
          .filter((item) => item.total > 0);
      }

      function ensureActiveSet() {
        if (state.activeSet && !archivedSets.has(state.activeSet) && categoryHasQuestions(state.activeSet)) return;
        state.activeSet = "";
        saveActiveSet();
        state.setChooserOpen = true;
        resetDetailFilters();
      }

      function selectLearningSet(category, restore = false) {
        if (!categoryHasQuestions(category)) return;
        if (restore) {
          archivedSets.delete(category);
          saveArchivedSets();
        }
        state.activeSet = category;
        saveActiveSet();
        resetDetailFilters();
        state.setChooserOpen = false;
        state.index = 0;
        state.revealed = false;
        state.editingId = "";
        state.selectedDeleteIds.clear();
        state.selectedDeleteCategories.clear();
        resetChoiceOrder(filtered()[state.index]);
        render();
      }

      function archiveLearningSet(category) {
        if (!category || !categoryHasQuestions(category)) return;
        const label = categoryLabels[category] || category;
        if (!window.confirm(`${label}を完了にして、普段の一問一答から非表示にしますか？\n問題と進捗は残り、あとから戻せます。`)) return;
        archivedSets.add(category);
        saveArchivedSets();
        if (state.activeSet === category) {
          state.activeSet = "";
          saveActiveSet();
          state.setChooserOpen = true;
          resetDetailFilters();
          state.index = 0;
        }
        render();
      }

      function renderActiveSetBar(items) {
        const hasActiveSet = Boolean(state.activeSet && categoryHasQuestions(state.activeSet));
        el.activeSetName.textContent = hasActiveSet ? (categoryLabels[state.activeSet] || state.activeSet) : "学習セットを選択してください";
        if (hasActiveSet) {
          const stats = setStats(state.activeSet);
          el.activeSetCounts.textContent = `${items.length}/${stats.total}問表示・${stats.known}習得・${stats.review}復習`;
        } else {
          el.activeSetCounts.textContent = "セットを選ぶと一問一答を始められます。";
        }
        el.archiveActiveSetButton.disabled = !hasActiveSet;
      }

      function createSetCard(item, archived = false) {
        const card = document.createElement("article");
        card.className = `set-card ${archived ? "is-archived" : ""}`;
        const title = document.createElement("h3");
        title.textContent = item.label;
        const meta = document.createElement("div");
        meta.className = "set-card-meta";
        meta.textContent = `${item.total}問・${item.known}習得・${item.review}復習・${item.newCount}未着手`;
        const actions = document.createElement("div");
        actions.className = "set-card-actions";

        const start = document.createElement("button");
        start.type = "button";
        start.className = "primary";
        start.textContent = archived ? "戻して始める" : "このセットで始める";
        start.addEventListener("click", () => selectLearningSet(item.category, archived));
        actions.appendChild(start);

        if (!archived) {
          const archive = document.createElement("button");
          archive.type = "button";
          archive.textContent = "完了にする";
          archive.addEventListener("click", () => archiveLearningSet(item.category));
          actions.appendChild(archive);
        }

        card.append(title, meta, actions);
        return card;
      }

      function renderSetChooser() {
        el.setChooser.classList.toggle("hidden", !state.setChooserOpen);
        el.closeSetChooserButton.hidden = !state.activeSet;
        if (!state.setChooserOpen) return;

        const categories = activeCategories();
        const openSets = categories.filter((item) => !archivedSets.has(item.category));
        const archived = categories.filter((item) => archivedSets.has(item.category));

        if (openSets.length) {
          el.setList.replaceChildren(...openSets.map((item) => createSetCard(item, false)));
        } else {
          const empty = document.createElement("p");
          empty.className = "set-empty";
          empty.textContent = "通常表示できる学習セットがありません。アーカイブから戻してください。";
          el.setList.replaceChildren(empty);
        }

        if (archived.length) {
          el.archivedSetList.replaceChildren(...archived.map((item) => createSetCard(item, true)));
        } else {
          const empty = document.createElement("p");
          empty.className = "set-empty";
          empty.textContent = "アーカイブ済みの学習セットはありません。";
          el.archivedSetList.replaceChildren(empty);
        }
      }

      function renderFilters() {
        const activeQuestions = state.activeSet ? categoryQuestions(state.activeSet) : [];
        setOptions(el.categoryFilter, state.category, [
          ["all", "現在のセット"],
          ...(state.activeSet ? [[state.activeSet, categoryLabels[state.activeSet] || state.activeSet]] : [])
        ]);

        setOptions(el.importCategory, el.importCategory.value || "quiz", [
          ...importCategoryEntries()
        ]);

        setOptions(el.sourceFilter, state.source, [
          ["all", "すべて"],
          ...unique(activeQuestions.map((question) => question.source))
            .sort((a, b) => sourceRank(a) - sourceRank(b) || String(a).localeCompare(String(b), "ja", { numeric: true }))
            .map((source) => [source, source])
        ]);

        setOptions(el.typeFilter, state.type, [
          ["all", "すべて"],
          ...unique(activeQuestions.map((question) => question.type)).map((type) => [type, typeLabels[type] || type])
        ]);

        setOptions(el.statusFilter, state.status, [
          ["all", "すべて"],
          ["new", "未着手"],
          ["known", "習得"],
          ["review", "復習"]
        ]);
      }

      function renderCategoryNameInputs() {
        el.categoryEditorPanel.classList.toggle("hidden", !state.categoryEditing || state.mode !== "list");
        el.toggleCategoryEditorButton.textContent = state.categoryEditing ? "カテゴリ名編集を閉じる" : "カテゴリ名を編集";
        if (!state.categoryEditing || state.mode !== "list") return;
        const categories = importCategoryEntries().map(([category]) => category);
        el.categoryEditorList.replaceChildren(...categories.map((category, index) => {
          const row = document.createElement("div");
          row.className = "category-row";
          row.dataset.categoryRow = category;

          const handle = document.createElement("span");
          handle.className = "category-drag-handle";
          handle.textContent = "↕";
          handle.draggable = true;
          handle.setAttribute("role", "button");
          handle.setAttribute("aria-label", `${categoryLabels[category] || category}をドラッグして並べ替え`);
          handle.addEventListener("dragstart", (event) => {
            captureCategoryEditorLabels();
            state.draggingCategory = category;
            row.classList.add("is-dragging");
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", category);
          });
          handle.addEventListener("dragend", () => {
            state.draggingCategory = "";
            el.categoryEditorList.querySelectorAll(".category-row").forEach((item) => {
              item.classList.remove("is-dragging", "is-drag-over");
            });
          });
          row.addEventListener("dragover", (event) => {
            event.preventDefault();
            if (state.draggingCategory && state.draggingCategory !== category) {
              row.classList.add("is-drag-over");
            }
          });
          row.addEventListener("dragleave", () => row.classList.remove("is-drag-over"));
          row.addEventListener("drop", (event) => {
            event.preventDefault();
            row.classList.remove("is-drag-over");
            const draggedCategory = event.dataTransfer.getData("text/plain") || state.draggingCategory;
            moveCategoryTo(draggedCategory, category);
          });

          const rank = document.createElement("span");
          rank.className = "category-rank";
          rank.textContent = String(index + 1);

          const input = document.createElement("input");
          input.type = "text";
          input.value = categoryLabels[category] || category;
          input.placeholder = defaultCategoryLabels[category] || category;
          input.dataset.categoryName = category;
          input.setAttribute("aria-label", `${categoryLabels[category] || category}の表示名`);

          const controls = document.createElement("div");
          controls.className = "category-controls";
          const up = document.createElement("button");
          up.type = "button";
          up.textContent = "↑";
          up.disabled = index === 0;
          up.setAttribute("aria-label", `${categoryLabels[category] || category}を上へ移動`);
          up.addEventListener("click", () => moveCategory(category, -1));
          const down = document.createElement("button");
          down.type = "button";
          down.textContent = "↓";
          down.disabled = index === categories.length - 1;
          down.setAttribute("aria-label", `${categoryLabels[category] || category}を下へ移動`);
          down.addEventListener("click", () => moveCategory(category, 1));
          controls.append(up, down);

          row.append(handle, rank, input, controls);
          return row;
        }));
      }

      function moveCategory(category, delta) {
        captureCategoryEditorLabels();
        const categories = importCategoryEntries().map(([value]) => value);
        const index = categories.indexOf(category);
        const target = index + delta;
        if (index < 0 || target < 0 || target >= categories.length) return;
        [categories[index], categories[target]] = [categories[target], categories[index]];
        categoryOrder = categories;
        saveCategoryOrder();
        applyCategoryOrderToQuestions();
        el.categoryStatus.textContent = "表示順を変更しました。";
        render();
      }

      function moveCategoryTo(category, targetCategory) {
        if (!category || !targetCategory || category === targetCategory) return;
        captureCategoryEditorLabels();
        const categories = importCategoryEntries().map(([value]) => value);
        const index = categories.indexOf(category);
        const target = categories.indexOf(targetCategory);
        if (index < 0 || target < 0) return;
        categories.splice(index, 1);
        categories.splice(target, 0, category);
        categoryOrder = categories;
        saveCategoryOrder();
        applyCategoryOrderToQuestions();
        el.categoryStatus.textContent = "表示順を変更しました。";
        render();
      }

      function captureCategoryEditorLabels() {
        el.categoryEditorList.querySelectorAll("[data-category-name]").forEach((input) => {
          const category = input.dataset.categoryName;
          categoryLabels[category] = input.value.trim() || defaultCategoryLabels[category] || category;
        });
      }

      function renderDeletePanel() {
        el.deletePanel.classList.toggle("hidden", !state.deleteMode || state.mode !== "list");
        el.toggleDeleteModeButton.textContent = state.deleteMode ? "まとめて削除を閉じる" : "まとめて削除";
        el.deleteSelectedButton.disabled = state.selectedDeleteIds.size === 0;
        el.deleteSelectedCategoriesButton.disabled = state.selectedDeleteCategories.size === 0;
        el.clearSelectedCategoriesButton.disabled = state.selectedDeleteCategories.size === 0;
        renderCategoryDeleteButtons();
        if (!state.deleteMode || state.mode !== "list") {
          el.deleteStatus.textContent = "";
        } else if (state.deleteMessage) {
          el.deleteStatus.textContent = state.deleteMessage;
        } else {
          const categoryCount = state.selectedDeleteCategories.size;
          el.deleteStatus.textContent = `${state.selectedDeleteIds.size}問、${categoryCount}カテゴリを選択中`;
        }
      }

      function renderCategoryDeleteButtons() {
        if (!state.deleteMode || state.mode !== "list") {
          el.categoryDeleteList.replaceChildren();
          return;
        }
        const categories = categoryEntries()
          .map(([category, label]) => ({
            category,
            label,
            count: allQuestions.filter((question) => question.category === category).length
          }))
          .filter((item) => item.count > 0);

        if (!categories.length) {
          const empty = document.createElement("p");
          empty.className = "helper";
          empty.textContent = "削除できるカテゴリはありません。";
          el.categoryDeleteList.replaceChildren(empty);
          return;
        }

        el.categoryDeleteList.replaceChildren(...categories.map((item) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = state.selectedDeleteCategories.has(item.category) ? "is-selected" : "";
          button.textContent = `${item.label} (${item.count}問)`;
          button.setAttribute("aria-pressed", String(state.selectedDeleteCategories.has(item.category)));
          button.addEventListener("click", () => {
            if (state.selectedDeleteCategories.has(item.category)) {
              state.selectedDeleteCategories.delete(item.category);
            } else {
              state.selectedDeleteCategories.add(item.category);
            }
            state.deleteMessage = "";
            render();
          });
          return button;
        }));
      }

      function renderStatus(items) {
        const known = allQuestions.filter((question) => state.progress[question.id] === "known").length;
        const review = allQuestions.filter((question) => state.progress[question.id] === "review").length;
        el.totalCount.textContent = `${items.length}/${allQuestions.length}問`;
        el.knownCount.textContent = `${known}習得`;
        el.reviewCount.textContent = `${review}復習`;

        el.dataStatus.hidden = false;
        el.dataStatus.className = `data-status ${validationIssues.length ? "bad" : "ok"}`;
        el.dataStatus.textContent = validationIssues.length ? `データ確認: ${validationIssues.length}件` : `データOK: ${allQuestions.length}問`;
        el.dataStatus.title = validationIssues.join("\n");
      }

      function renderQuiz(items) {
        if (!items.length) {
          el.meta.replaceChildren();
          el.images.replaceChildren();
          el.prompt.textContent = "条件に合う問題がありません。";
          el.choices.replaceChildren();
          el.feedback.className = "feedback hidden";
          el.answer.className = "answer hidden";
          el.answerButton.disabled = true;
          el.knownButton.disabled = true;
          el.reviewButton.disabled = true;
          el.prevButton.disabled = true;
          el.nextButton.disabled = true;
          return;
        }

        el.answerButton.disabled = false;
        el.knownButton.disabled = false;
        el.reviewButton.disabled = false;
        el.prevButton.disabled = false;
        el.nextButton.disabled = false;

        if (state.index >= items.length) state.index = 0;
        const question = items[state.index];
        const response = getResponse(question);
        const progress = state.progress[question.id] || "new";

        el.meta.replaceChildren(
          pill(question.source),
          pill(`${categoryLabels[question.category] || question.category} / ${typeLabels[question.type] || question.type}`),
          pill(`${state.index + 1} / ${items.length}`)
        );
        el.images.replaceChildren(...question.images.map((src) => {
          const img = document.createElement("img");
          img.src = src;
          img.alt = `${question.source}の図`;
          return img;
        }));
        el.prompt.textContent = displayPrompt(question);
        renderInteraction(question, response);

        const feedbackClass = response.correct === null ? "neutral" : response.correct ? "ok" : "bad";
        const feedbackTitle = response.correct === null ? "模範解答" : response.correct ? "正解" : "不正解";
        const feedbackDetail = response.correct === null ? "答えを確認して、分かった・復習を選んでください。" : response.correct ? "その調子です。" : "正解を確認しましょう。";
        el.feedback.className = `feedback ${feedbackClass} ${response.checked ? "" : "hidden"}`;
        el.feedback.replaceChildren();
        if (response.checked) {
          const title = document.createElement("strong");
          title.textContent = feedbackTitle;
          const detail = document.createElement("span");
          detail.textContent = feedbackDetail;
          const answerBox = document.createElement("div");
          answerBox.className = "feedback-answer";
          const answerLabel = document.createElement("span");
          answerLabel.className = "feedback-answer-label";
          answerLabel.textContent = "答え";
          const answerValue = document.createElement("strong");
          answerValue.className = "feedback-answer-value";
          answerValue.textContent = question.answer || "解答なし";
          answerBox.append(answerLabel, answerValue);
          const explanationBox = document.createElement("div");
          explanationBox.className = "feedback-answer feedback-explanation";
          const explanationLabel = document.createElement("span");
          explanationLabel.className = "feedback-answer-label";
          explanationLabel.textContent = "解説";
          const explanationValue = document.createElement("span");
          explanationValue.className = "feedback-answer-value";
          explanationValue.textContent = explanationText(question);
          explanationBox.append(explanationLabel, explanationValue);
          el.feedback.append(title, detail, answerBox, explanationBox);
        }

        el.answer.className = "answer hidden";
        el.answer.replaceChildren();
        el.answerButton.textContent = response.checked ? "もう一度答え合わせ" : "答え合わせ";
        el.answerButton.disabled = !canCheckAnswer(question);
        el.knownButton.classList.toggle("is-active", progress === "known");
        el.reviewButton.classList.toggle("is-active", progress === "review");
      }

      function pill(text) {
        const span = document.createElement("span");
        span.className = "pill";
        span.textContent = text;
        return span;
      }

      function listText(values) {
        return (Array.isArray(values) ? values : []).join("\n");
      }

      function fieldList(value) {
        return String(value || "")
          .split(/\r?\n/)
          .map((item) => item.trim())
          .filter(Boolean);
      }

      function makeLabeledControl(labelText, control) {
        const wrapper = document.createElement("div");
        const label = document.createElement("label");
        label.textContent = labelText;
        wrapper.append(label, control);
        return wrapper;
      }

      function createInput(value, type = "text") {
        const input = document.createElement("input");
        input.type = type;
        input.value = value;
        return input;
      }

      function createTextarea(value, placeholder = "") {
        const textarea = document.createElement("textarea");
        textarea.value = value;
        textarea.placeholder = placeholder;
        return textarea;
      }

      function createSelect(entries, value) {
        const select = document.createElement("select");
        select.replaceChildren(...entries.map(([optionValue, label]) => option(optionValue, label)));
        select.value = value;
        return select;
      }

      function createInlineQuestionEditor(question) {
        const section = document.createElement("section");
        section.className = "editor-panel";

        const grid = document.createElement("div");
        grid.className = "editor-grid";

        const source = createInput(question.source);
        const category = createSelect([
          ...categoryEntries()
        ], question.category);
        const type = createSelect(supportedTypes.map((item) => [item, typeLabels[item] || item]), question.type);
        const number = createInput(question.number || 1, "number");
        number.min = "1";
        const prompt = createTextarea(question.prompt);
        const answer = createTextarea(question.answer);
        const explanation = createTextarea(question.explanation, "空欄なら自動で短文解説を表示します");
        const choices = createTextarea(listText(question.choices), "1行に1つずつ入力");
        const images = createTextarea(listText(question.images), "assets/example.png のように1行に1つずつ入力");

        const promptField = makeLabeledControl("問題文", prompt);
        promptField.className = "editor-field-wide";
        const answerField = makeLabeledControl("答え", answer);
        answerField.className = "editor-field-wide";
        const explanationField = makeLabeledControl("解説", explanation);
        explanationField.className = "editor-field-wide";
        const choicesField = makeLabeledControl("選択肢", choices);
        choicesField.className = "editor-field-wide";
        const imagesField = makeLabeledControl("画像", images);
        imagesField.className = "editor-field-wide";

        grid.append(
          makeLabeledControl("範囲", source),
          makeLabeledControl("カテゴリ", category),
          makeLabeledControl("形式", type),
          makeLabeledControl("番号", number),
          promptField,
          answerField,
          explanationField,
          choicesField,
          imagesField
        );

        const actions = document.createElement("div");
        actions.className = "editor-actions";
        const save = document.createElement("button");
        save.type = "button";
        save.className = "primary";
        save.textContent = "問題を保存";
        const cancel = document.createElement("button");
        cancel.type = "button";
        cancel.textContent = "閉じる";
        const reset = document.createElement("button");
        reset.type = "button";
        reset.textContent = "元に戻す";

        save.addEventListener("click", () => {
          const edited = normalize([{
            ...question,
            source: source.value.trim() || "未分類",
            category: category.value,
            number: Number(number.value || question.number || 1),
            prompt: prompt.value.trim(),
            answer: answer.value.trim(),
            explanation: explanation.value.trim(),
            type: type.value,
            choices: fieldList(choices.value),
            images: fieldList(images.value)
          }], category.value)[0];
          questionEdits[question.id] = {
            source: edited.source,
            category: edited.category,
            number: edited.number,
            prompt: edited.prompt,
            answer: edited.answer,
            explanation: edited.explanation,
            type: edited.type,
            choices: edited.choices,
            images: edited.images
          };
          saveQuestionEdits();
          refreshQuestionData();
          state.editingId = question.id;
          state.revealed = false;
          delete state.responses[question.id];
          render();
        });

        cancel.addEventListener("click", () => {
          state.editingId = "";
          render();
        });

        reset.addEventListener("click", () => {
          delete questionEdits[question.id];
          saveQuestionEdits();
          refreshQuestionData();
          state.editingId = "";
          state.revealed = false;
          render();
        });

        actions.append(save, cancel, reset);
        section.append(grid, actions);
        return section;
      }

      function renderInteraction(question, response) {
        el.choices.replaceChildren();

        if (question.type === "single" || question.type === "multiple") {
          randomizedChoices(question, response).forEach((choice) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = `choice ${response.selected.includes(choice) ? "is-selected" : ""}`;
            button.textContent = choice;
            button.addEventListener("click", () => {
              response.checked = false;
              state.revealed = false;
              response.selected = question.type === "single"
                ? [choice]
                : response.selected.includes(choice)
                  ? response.selected.filter((item) => item !== choice)
                  : [...response.selected, choice];
              render();
            });
            el.choices.appendChild(button);
          });
          return;
        }

        if (question.type === "matching") {
          const choices = randomizedChoices(question, response).map(parseChoice);
          parseMatchingAnswer(question.answer).forEach((pair) => {
            const row = document.createElement("div");
            row.className = "matching-row";
            const label = document.createElement("span");
            label.className = "matching-label";
            label.textContent = pair.label;
            const options = document.createElement("div");
            options.className = "matching-options";
            choices.forEach((choice) => {
              const button = document.createElement("button");
              button.type = "button";
              button.className = `choice ${response.matching[pair.label] === choice.label ? "is-selected" : ""}`;
              button.textContent = choice.label;
              button.addEventListener("click", () => {
                response.checked = false;
                response.matching[pair.label] = choice.label;
                render();
              });
              options.appendChild(button);
            });
            row.append(label, options);
            el.choices.appendChild(row);
          });
          return;
        }

        const input = document.createElement("input");
        input.type = "text";
        input.value = response.text;
        input.placeholder = "答えを入力";
        let isComposingText = false;
        let justComposedText = false;
        input.addEventListener("input", (event) => {
          response.checked = false;
          response.text = event.target.value;
        });
        input.addEventListener("compositionstart", () => {
          isComposingText = true;
        });
        input.addEventListener("compositionend", () => {
          isComposingText = false;
          justComposedText = true;
          setTimeout(() => {
            justComposedText = false;
          }, 0);
        });
        input.addEventListener("keydown", (event) => {
          if (event.key !== "Enter") return;
          if (isComposingText || justComposedText || event.isComposing || event.keyCode === 229) return;
          event.preventDefault();
          judge(question);
        });
        el.choices.append(input);
      }

      function renderList(items) {
        el.listItems.replaceChildren(...items.map((question) => {
          const card = document.createElement("article");
          card.className = "list-card";
          if (state.deleteMode) {
            const select = document.createElement("label");
            select.className = "helper";
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = state.selectedDeleteIds.has(question.id);
            checkbox.addEventListener("change", () => {
              if (checkbox.checked) {
                state.selectedDeleteIds.add(question.id);
              } else {
                state.selectedDeleteIds.delete(question.id);
              }
              state.deleteMessage = "";
              renderDeletePanel();
            });
            select.append(checkbox, " 削除対象にする");
            card.appendChild(select);
          }
          const title = document.createElement("h2");
          title.textContent = `${categoryLabels[question.category] || question.category} / ${question.source} / ${typeLabels[question.type] || question.type}`;
          const prompt = document.createElement("p");
          prompt.textContent = displayPrompt(question);
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = "答えを確認";
          const editButton = document.createElement("button");
          editButton.type = "button";
          editButton.textContent = "編集";
          const answer = document.createElement("p");
          answer.className = "hidden";
          answer.textContent = `答え: ${question.answer}`;
          button.addEventListener("click", () => {
            answer.classList.toggle("hidden");
            button.textContent = answer.classList.contains("hidden") ? "答えを確認" : "答えを閉じる";
          });
          editButton.addEventListener("click", () => {
            state.editingId = state.editingId === question.id ? "" : question.id;
            render();
          });
          card.append(title, prompt, button, editButton, answer);
          if (state.editingId === question.id) {
            card.appendChild(createInlineQuestionEditor(question));
          }
          return card;
        }));
      }

      function deleteSelectedQuestions() {
        if (!state.selectedDeleteIds.size) return;
        state.selectedDeleteIds.forEach((id) => {
          deletedQuestionIds.add(id);
          delete state.progress[id];
          delete state.responses[id];
        });
        saveDeletedQuestionIds();
        saveProgress();
        state.selectedDeleteIds.clear();
        state.editingId = "";
        refreshQuestionData();
        state.deleteMessage = "選択した問題を削除しました。";
        render();
      }

      function deleteCategoryQuestions(category, label) {
        const targets = allQuestions.filter((question) => question.category === category);
        targets.forEach((question) => {
          deletedQuestionIds.add(question.id);
          delete state.progress[question.id];
          delete state.responses[question.id];
        });
        saveDeletedQuestionIds();
        saveProgress();
        state.selectedDeleteIds.clear();
        state.editingId = "";
        refreshQuestionData();
        state.deleteMessage = `${label}を${targets.length}問削除しました。`;
        render();
      }

      function deleteSelectedCategories() {
        if (!state.selectedDeleteCategories.size) return;
        const labels = categoryEntries()
          .filter(([category]) => state.selectedDeleteCategories.has(category))
          .map(([, label]) => label);
        const targets = allQuestions.filter((question) => state.selectedDeleteCategories.has(question.category));
        targets.forEach((question) => {
          deletedQuestionIds.add(question.id);
          delete state.progress[question.id];
          delete state.responses[question.id];
        });
        saveDeletedQuestionIds();
        saveProgress();
        state.selectedDeleteIds.clear();
        state.selectedDeleteCategories.clear();
        state.editingId = "";
        refreshQuestionData();
        state.deleteMessage = `${labels.join("、")}を${targets.length}問削除しました。`;
        render();
      }

      function restoreDeletedQuestions() {
        deletedQuestionIds = new Set();
        saveDeletedQuestionIds();
        state.selectedDeleteIds.clear();
        state.selectedDeleteCategories.clear();
        refreshQuestionData();
        state.deleteMessage = "削除を全解除しました。";
        render();
      }

      function move(delta) {
        const items = filtered();
        if (!items.length) return;
        state.index = (state.index + delta + items.length) % items.length;
        state.revealed = false;
        state.editingId = "";
        state.selectedDeleteIds.clear();
        resetChoiceOrder(filtered()[state.index]);
        render();
      }

      function mark(status) {
        const question = filtered()[state.index];
        if (!question) return;
        if (state.progress[question.id] === status) {
          delete state.progress[question.id];
        } else {
          state.progress[question.id] = status;
        }
        saveProgress();
        render();
      }

      function render() {
        const items = filtered();
        renderFilters();
        renderSetChooser();
        renderActiveSetBar(items);
        renderStatus(items);
        renderCategoryNameInputs();
        renderDeletePanel();
        const showWorkspace = !state.setChooserOpen && Boolean(state.activeSet);
        el.mainToolbar.classList.toggle("hidden", !showWorkspace);
        el.importPanel.classList.toggle("hidden", !showWorkspace);
        el.quizView.classList.toggle("hidden", !showWorkspace || state.mode !== "quiz");
        el.listView.classList.toggle("hidden", !showWorkspace || state.mode !== "list");
        el.quizMode.classList.toggle("is-active", state.mode === "quiz");
        el.listMode.classList.toggle("is-active", state.mode === "list");
        if (showWorkspace) {
          renderQuiz(items);
          renderList(items);
        }
      }

      function updateFilter(key, value) {
        state[key] = value;
        state.index = 0;
        state.revealed = false;
        state.editingId = "";
        resetChoiceOrder(filtered()[state.index]);
        render();
      }

      el.searchInput.addEventListener("input", (event) => updateFilter("query", event.target.value));
      el.fileKind.addEventListener("change", () => {
        if (el.fileKind.value === "quiz") el.importCategory.value = "quiz";
        if (el.fileKind.value === "slides") el.importCategory.value = "prediction";
        el.importStatus.textContent = el.fileKind.value === "slides"
          ? "授業スライドは予想問題として追加されます。"
          : "";
        render();
      });
      el.fileInput.addEventListener("change", (event) => {
        importFiles([...event.target.files]).catch((error) => {
          el.importStatus.textContent = `読み込みに失敗しました: ${error.message}`;
        });
      });
      el.pasteButton.addEventListener("click", () => {
        try {
          const text = el.pasteInput.value.trim();
          if (!text) {
            el.importStatus.textContent = "貼り付け欄が空です。";
            return;
          }
          const questions = parseQuestionFile(text, "貼り付けデータ.txt", el.importCategory.value, el.fileKind.value);
          addImportedQuestions(questions, "貼り付け", el.fileKind.value);
          el.pasteInput.value = "";
        } catch (error) {
          el.importStatus.textContent = `読み込みに失敗しました: ${error.message}`;
        }
      });
      el.clearImportedButton.addEventListener("click", () => {
        importedQuestions = [];
        saveImportedQuestions();
        refreshQuestionData();
        state.index = 0;
        state.revealed = false;
        state.editingId = "";
        el.importStatus.textContent = "追加データを削除しました。";
        render();
      });
      el.toggleCategoryEditorButton.addEventListener("click", () => {
        state.categoryEditing = !state.categoryEditing;
        if (state.categoryEditing) {
          state.deleteMode = false;
          state.deleteMessage = "";
          state.selectedDeleteIds.clear();
          state.selectedDeleteCategories.clear();
          state.editingId = "";
        }
        el.categoryStatus.textContent = "";
        render();
      });
      el.toggleDeleteModeButton.addEventListener("click", () => {
        state.deleteMode = !state.deleteMode;
        if (state.deleteMode) {
          state.categoryEditing = false;
          state.editingId = "";
        }
        state.selectedDeleteIds.clear();
        state.selectedDeleteCategories.clear();
        state.deleteMessage = "";
        render();
      });
      el.selectVisibleButton.addEventListener("click", () => {
        filtered().forEach((question) => state.selectedDeleteIds.add(question.id));
        state.deleteMessage = "";
        render();
      });
      el.deleteSelectedButton.addEventListener("click", deleteSelectedQuestions);
      el.deleteSelectedCategoriesButton.addEventListener("click", deleteSelectedCategories);
      el.clearSelectedCategoriesButton.addEventListener("click", () => {
        state.selectedDeleteCategories.clear();
        state.deleteMessage = "";
        render();
      });
      el.restoreDeletedButton.addEventListener("click", restoreDeletedQuestions);
      el.saveCategoryNamesButton.addEventListener("click", () => {
        categoryLabels = { ...categoryLabels };
        captureCategoryEditorLabels();
        categoryOrder = [...el.categoryEditorList.querySelectorAll("[data-category-row]")].map((row) => row.dataset.categoryRow);
        saveCategoryLabels();
        saveCategoryOrder();
        applyCategoryOrderToQuestions();
        el.categoryStatus.textContent = "カテゴリ設定を保存しました。";
        render();
      });
      el.resetCategoryNamesButton.addEventListener("click", () => {
        categoryLabels = { ...defaultCategoryLabels };
        categoryOrder = [...defaultCategoryOrder];
        saveCategoryLabels();
        saveCategoryOrder();
        applyCategoryOrderToQuestions();
        el.categoryStatus.textContent = "カテゴリ設定を初期状態に戻しました。";
        render();
      });
      el.categoryFilter.addEventListener("change", (event) => {
        state.source = "all";
        updateFilter("category", event.target.value);
      });
      el.sourceFilter.addEventListener("change", (event) => updateFilter("source", event.target.value));
      el.typeFilter.addEventListener("change", (event) => updateFilter("type", event.target.value));
      el.statusFilter.addEventListener("change", (event) => updateFilter("status", event.target.value));
      el.changeSetButton.addEventListener("click", () => {
        state.setChooserOpen = true;
        state.editingId = "";
        state.deleteMode = false;
        state.categoryEditing = false;
        render();
      });
      el.closeSetChooserButton.addEventListener("click", () => {
        if (!state.activeSet) return;
        state.setChooserOpen = false;
        render();
      });
      el.archiveActiveSetButton.addEventListener("click", () => archiveLearningSet(state.activeSet));
      el.quizMode.addEventListener("click", () => updateFilter("mode", "quiz"));
      el.listMode.addEventListener("click", () => updateFilter("mode", "list"));
      el.shuffleButton.addEventListener("click", () => {
        state.order = state.order.map((value) => [Math.random(), value]).sort((a, b) => a[0] - b[0]).map((pair) => pair[1]);
        state.index = 0;
        state.revealed = false;
        resetChoiceOrder(filtered()[state.index]);
        render();
      });
      el.prevButton.addEventListener("click", () => move(-1));
      el.nextButton.addEventListener("click", () => move(1));
      el.answerButton.addEventListener("click", () => {
        const question = filtered()[state.index];
        if (!question || !canCheckAnswer(question)) return;
        judge(question);
      });
      el.knownButton.addEventListener("click", () => mark("known"));
      el.reviewButton.addEventListener("click", () => mark("review"));

      document.addEventListener("keydown", (event) => {
        if (state.mode !== "quiz") return;
        if (event.target.matches("input, textarea, select, [contenteditable='true']")) return;
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          move(-1);
        }
        if (event.key === "ArrowRight") {
          event.preventDefault();
          move(1);
        }
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js").catch(() => {}));
      }

      applyCategoryOrderToQuestions();
      render();
    </script>
  </body>
</html>
