<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>汎用学習クイズ</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f5ef;
        --surface: #ffffff;
        --ink: #202724;
        --muted: #66706b;
        --line: #d9ddd8;
        --accent: #156b5e;
        --blue: #2d5f91;
        --orange: #b9602c;
        --ok: #1f6b3b;
        --bad: #943b29;
        --shadow: 0 18px 42px rgba(32, 39, 36, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "YuGothic", "Segoe UI", sans-serif;
        line-height: 1.65;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        padding: 0 14px;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }

      .primary,
      .is-active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
        padding: 26px clamp(16px, 4vw, 46px) 18px;
        border-bottom: 1px solid var(--line);
      }

      .eyebrow {
        margin: 0 0 2px;
        color: var(--orange);
        font-size: 0.78rem;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.55rem, 3vw, 2.25rem);
        line-height: 1.15;
        letter-spacing: 0;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        padding: 3px 10px;
        color: var(--muted);
        font-size: 0.86rem;
        white-space: nowrap;
      }

      main {
        display: grid;
        grid-template-columns: minmax(230px, 290px) 1fr;
        gap: 22px;
        padding: 24px clamp(16px, 4vw, 46px) 42px;
      }

      aside,
      .quiz-card,
      .list-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      aside {
        position: sticky;
        top: 16px;
        align-self: start;
        padding: 16px;
      }

      label,
      .filter-title {
        display: block;
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        padding: 8px 10px;
      }

      textarea {
        min-height: 92px;
        resize: vertical;
      }

      .filter {
        margin-top: 18px;
      }

      .import-panel {
        display: grid;
        gap: 10px;
        margin-top: 20px;
        border-top: 1px solid var(--line);
        padding-top: 18px;
      }

      .import-panel button {
        width: 100%;
      }

      .helper {
        margin: 0;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.5;
      }

      .import-status {
        margin: 0;
        color: var(--accent);
        font-size: 0.84rem;
        font-weight: 700;
        min-height: 1.4em;
      }


      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .segmented {
        display: inline-flex;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .segmented button {
        border: 0;
        border-radius: 0;
        min-width: 88px;
      }

      .quiz-card {
        box-shadow: var(--shadow);
        padding: clamp(18px, 4vw, 32px);
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 18px;
      }

      .question {
        margin: 0;
        white-space: pre-line;
        font-size: clamp(1.08rem, 2vw, 1.32rem);
        line-height: 1.8;
      }

      .images {
        display: grid;
        gap: 12px;
        margin-bottom: 18px;
      }

      .images img {
        width: min(100%, 680px);
        max-height: 420px;
        object-fit: contain;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .choices {
        display: grid;
        gap: 9px;
        margin-top: 20px;
      }

      .choice {
        min-height: 46px;
        border: 1px solid #c8d8e9;
        border-left: 4px solid var(--blue);
        background: #f5f8fb;
        color: #243346;
        text-align: left;
      }

      .choice.is-selected {
        border-color: var(--blue);
        background: #dcecf7;
        color: #183759;
        font-weight: 700;
      }

      .matching-row {
        display: grid;
        grid-template-columns: 58px 1fr;
        gap: 10px;
        align-items: start;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        background: #fbfcfb;
      }

      .matching-label {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        border-radius: 6px;
        background: #edf5f1;
        color: var(--accent);
        font-weight: 700;
      }

      .matching-options {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .feedback,
      .answer,
      .data-status,
      .editor-panel {
        margin-top: 18px;
        border-radius: 8px;
        padding: 12px 14px;
      }

      .feedback strong,
      .feedback span,
      .answer span,
      .answer strong {
        display: block;
      }

      .feedback.ok,
      .data-status.ok {
        border: 1px solid #b7d8c3;
        background: #edf8f0;
        color: var(--ok);
      }

      .feedback.bad,
      .data-status.bad {
        border: 1px solid #efc1b6;
        background: #fff0ec;
        color: var(--bad);
      }

      .feedback.neutral {
        border: 1px solid #c8d8e9;
        background: #f5f8fb;
        color: #243346;
      }

      .answer {
        border-left: 5px solid var(--orange);
        background: #fff7f0;
      }

      .answer span {
        color: var(--orange);
        font-size: 0.78rem;
        font-weight: 700;
      }

      .answer strong {
        margin-top: 4px;
        white-space: pre-line;
        font-size: 1.12rem;
      }

      .editor-panel {
        display: grid;
        gap: 12px;
        border: 1px solid var(--line);
        background: #fbfcfb;
      }

      .editor-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .editor-field-wide {
        grid-column: 1 / -1;
      }

      .editor-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .editor-actions button {
        min-width: 110px;
      }

      .list-tools {
        display: grid;
        gap: 10px;
      }

      .list-tools > button {
        justify-self: start;
      }

      .actions {
        display: grid;
        grid-template-columns: 42px minmax(112px, 1fr) minmax(70px, auto) minmax(92px, auto) minmax(82px, auto) 42px;
        gap: 8px;
        margin-top: 24px;
      }

      .icon {
        width: 42px;
        padding: 0;
        font-size: 1.15rem;
      }

      .list {
        display: grid;
        gap: 12px;
      }

      .list-card {
        padding: 16px;
      }

      .list-card h2 {
        margin: 0 0 8px;
        font-size: 1rem;
      }

      .list-card p {
        margin: 8px 0 0;
        white-space: pre-line;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 820px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        main {
          grid-template-columns: 1fr;
        }

        aside {
          position: static;
        }

        .toolbar {
          align-items: stretch;
          flex-direction: column;
        }

        .segmented,
        .toolbar button {
          width: 100%;
        }

        .actions {
          grid-template-columns: 42px 1fr 42px;
        }

        .actions .mark {
          grid-column: span 3;
        }

        .editor-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">Common JSON quiz format</p>
        <h1>汎用学習クイズ</h1>
      </div>
      <div class="stats" aria-live="polite">
        <span id="totalCount" class="pill">0問</span>
        <span id="knownCount" class="pill">0習得</span>
        <span id="reviewCount" class="pill">0復習</span>
      </div>
    </header>

    <main>
      <aside aria-label="問題フィルター">
        <label for="searchInput">検索</label>
        <input id="searchInput" type="search" placeholder="問題文・答えで検索">

        <div class="filter">
          <label for="categoryFilter">問題区分</label>
          <select id="categoryFilter"></select>
        </div>

        <div class="filter">
          <label for="sourceFilter">範囲</label>
          <select id="sourceFilter"></select>
        </div>

        <div class="filter">
          <label for="typeFilter">形式</label>
          <select id="typeFilter"></select>
        </div>

        <div class="filter">
          <label for="statusFilter">進捗</label>
          <select id="statusFilter"></select>
        </div>

        <section class="import-panel" aria-label="問題データ追加">
          <p class="filter-title">ファイルから追加</p>
          <input id="fileInput" type="file" accept=".json,.js,.csv,.md,.markdown,.txt,.html,.htm" multiple>
          <label for="fileKind">ファイルの種類</label>
          <select id="fileKind">
            <option value="quiz">小テスト</option>
            <option value="slides">授業スライド</option>
            <option value="manual">手入力データ</option>
          </select>
          <label for="importCategory">追加先</label>
          <select id="importCategory">
            <option value="quiz">小テスト問題</option>
            <option value="prediction">予想問題</option>
          </select>
          <textarea id="pasteInput" placeholder="ここに Q: 問題 / A: 答え の形式や、CSV・Markdown表を貼り付けても追加できます"></textarea>
          <button id="pasteButton" type="button">貼り付け内容を追加</button>
          <button id="clearImportedButton" type="button">追加データを削除</button>
          <p class="helper">小テストは実際の問題として登録、授業スライドは空欄・重要語句から予想問題を作成します。PDFは本文をコピーして貼り付けると読み取れます。</p>
          <p id="importStatus" class="import-status" aria-live="polite"></p>
        </section>

        <div id="dataStatus" class="data-status" hidden></div>
      </aside>

      <section>
        <div class="toolbar">
          <div class="segmented" aria-label="表示切替">
            <button id="quizMode" class="is-active" type="button">一問一答</button>
            <button id="listMode" type="button">一覧</button>
          </div>
          <button id="shuffleButton" type="button">シャッフル</button>
        </div>

        <section id="quizView">
          <article id="quizCard" class="quiz-card">
            <div id="meta" class="meta"></div>
            <div id="images" class="images"></div>
            <p id="prompt" class="question"></p>
            <div id="choices" class="choices"></div>
            <div id="feedback" class="feedback hidden"></div>
            <div id="answer" class="answer hidden"></div>
            <div class="actions">
              <button id="prevButton" class="icon" type="button" aria-label="前の問題">←</button>
              <button id="answerButton" class="primary" type="button">答え合わせ</button>
              <button id="knownButton" class="mark" type="button">分かった</button>
              <button id="reviewButton" class="mark" type="button">復習</button>
              <button id="nextButton" class="icon" type="button" aria-label="次の問題">→</button>
            </div>
          </article>
        </section>

        <section id="listView" class="list hidden">
          <section class="list-tools" aria-label="一覧編集">
            <button id="toggleCategoryEditorButton" type="button">カテゴリ名を編集</button>
            <button id="toggleDeleteModeButton" type="button">まとめて削除</button>
            <section id="categoryEditorPanel" class="editor-panel hidden" aria-label="カテゴリ名編集">
              <div class="editor-grid">
                <div id="quizCategoryField">
                  <label for="quizCategoryName">小テスト側の名前</label>
                  <input id="quizCategoryName" type="text">
                </div>
                <div id="predictionCategoryField">
                  <label for="predictionCategoryName">予想問題側の名前</label>
                  <input id="predictionCategoryName" type="text">
                </div>
                <div id="audioCategoryField">
                  <label for="audioCategoryName">音声工学側の名前</label>
                  <input id="audioCategoryName" type="text">
                </div>
              </div>
              <div class="editor-actions">
                <button id="saveCategoryNamesButton" class="primary" type="button">カテゴリ名を保存</button>
                <button id="resetCategoryNamesButton" type="button">カテゴリ名を戻す</button>
              </div>
              <p id="categoryStatus" class="import-status" aria-live="polite"></p>
            </section>
            <section id="deletePanel" class="editor-panel hidden" aria-label="まとめて削除">
              <p class="helper">削除した問題はこの端末では非表示になります。必要な場合は削除を全解除できます。</p>
              <div class="editor-actions">
                <button id="selectVisibleButton" type="button">表示中を全選択</button>
                <button id="deleteSelectedButton" class="primary" type="button">選択した問題を削除</button>
                <button id="restoreDeletedButton" type="button">削除を全解除</button>
              </div>
              <p id="deleteStatus" class="import-status" aria-live="polite"></p>
            </section>
          </section>
          <div id="listItems" class="list"></div>
        </section>
      </section>
    </main>

    <script src="questions.js"></script>
    <script src="predicted_questions.js"></script>
    <script src="study_extra_questions.js"></script>
    <script>
      const supportedTypes = ["single", "multiple", "matching", "text", "free"];
      const typeLabels = { single: "選択", multiple: "複数選択", matching: "対応", text: "入力", free: "自由記述" };
      const defaultCategoryLabels = { quiz: "小テスト問題", prediction: "予想問題", audio: "音声工学" };
      const storageKey = "study-quiz-standalone-progress-v1";
      const importedStorageKey = "study-quiz-standalone-imported-v1";
      const questionEditsStorageKey = "study-quiz-standalone-edits-v1";
      const categoryLabelsStorageKey = "study-quiz-standalone-category-labels-v1";
      const deletedQuestionsStorageKey = "study-quiz-standalone-deleted-v1";
      let categoryLabels = loadCategoryLabels();

      const quizQuestions = normalize(window.QUESTION_DATA || [], "quiz");
      const predictedQuestions = normalize(window.PREDICTED_QUESTION_DATA || [], "prediction");
      const extraQuestions = normalize(window.STUDY_EXTRA_QUESTION_DATA || [], "quiz");
      let importedQuestions = loadImportedQuestions();
      let questionEdits = loadQuestionEdits();
      let deletedQuestionIds = new Set(loadDeletedQuestionIds());
      let allQuestions = visibleQuestions(applyQuestionEdits([...quizQuestions, ...predictedQuestions, ...extraQuestions, ...importedQuestions]));
      let validationIssues = validate(allQuestions);

      const state = {
        category: "all",
        source: "all",
        type: "all",
        status: "all",
        query: "",
        mode: "quiz",
        index: 0,
        revealed: false,
        editingId: "",
        categoryEditing: false,
        deleteMode: false,
        selectedDeleteIds: new Set(),
        order: allQuestions.map((_, index) => index),
        responses: {},
        progress: loadProgress()
      };

      const el = {
        totalCount: document.getElementById("totalCount"),
        knownCount: document.getElementById("knownCount"),
        reviewCount: document.getElementById("reviewCount"),
        searchInput: document.getElementById("searchInput"),
        categoryFilter: document.getElementById("categoryFilter"),
        sourceFilter: document.getElementById("sourceFilter"),
        typeFilter: document.getElementById("typeFilter"),
        statusFilter: document.getElementById("statusFilter"),
        fileInput: document.getElementById("fileInput"),
        fileKind: document.getElementById("fileKind"),
        importCategory: document.getElementById("importCategory"),
        pasteInput: document.getElementById("pasteInput"),
        pasteButton: document.getElementById("pasteButton"),
        clearImportedButton: document.getElementById("clearImportedButton"),
        importStatus: document.getElementById("importStatus"),
        toggleCategoryEditorButton: document.getElementById("toggleCategoryEditorButton"),
        toggleDeleteModeButton: document.getElementById("toggleDeleteModeButton"),
        categoryEditorPanel: document.getElementById("categoryEditorPanel"),
        quizCategoryField: document.getElementById("quizCategoryField"),
        quizCategoryName: document.getElementById("quizCategoryName"),
        predictionCategoryField: document.getElementById("predictionCategoryField"),
        predictionCategoryName: document.getElementById("predictionCategoryName"),
        audioCategoryField: document.getElementById("audioCategoryField"),
        audioCategoryName: document.getElementById("audioCategoryName"),
        saveCategoryNamesButton: document.getElementById("saveCategoryNamesButton"),
        resetCategoryNamesButton: document.getElementById("resetCategoryNamesButton"),
        categoryStatus: document.getElementById("categoryStatus"),
        deletePanel: document.getElementById("deletePanel"),
        selectVisibleButton: document.getElementById("selectVisibleButton"),
        deleteSelectedButton: document.getElementById("deleteSelectedButton"),
        restoreDeletedButton: document.getElementById("restoreDeletedButton"),
        deleteStatus: document.getElementById("deleteStatus"),
        dataStatus: document.getElementById("dataStatus"),
        quizMode: document.getElementById("quizMode"),
        listMode: document.getElementById("listMode"),
        shuffleButton: document.getElementById("shuffleButton"),
        quizView: document.getElementById("quizView"),
        listView: document.getElementById("listView"),
        quizCard: document.getElementById("quizCard"),
        meta: document.getElementById("meta"),
        images: document.getElementById("images"),
        prompt: document.getElementById("prompt"),
        choices: document.getElementById("choices"),
        feedback: document.getElementById("feedback"),
        answer: document.getElementById("answer"),
        answerButton: document.getElementById("answerButton"),
        knownButton: document.getElementById("knownButton"),
        reviewButton: document.getElementById("reviewButton"),
        prevButton: document.getElementById("prevButton"),
        nextButton: document.getElementById("nextButton"),
        listItems: document.getElementById("listItems")
      };

      function normalize(items, category) {
        return items.map((question, index) => ({
          ...question,
          id: question.id || `${category}-${index + 1}`,
          source: question.source || "未分類",
          category: question.category || category,
          number: question.number || index + 1,
          prompt: question.prompt || "",
          answer: question.answer || "",
          type: question.type || "single",
          choices: Array.isArray(question.choices) ? question.choices : [],
          images: Array.isArray(question.images) ? question.images : []
        }));
      }

      function loadProgress() {
        try {
          return JSON.parse(localStorage.getItem(storageKey)) || {};
        } catch {
          return {};
        }
      }

      function saveProgress() {
        localStorage.setItem(storageKey, JSON.stringify(state.progress));
      }

      function loadCategoryLabels() {
        try {
          return { ...defaultCategoryLabels, ...(JSON.parse(localStorage.getItem(categoryLabelsStorageKey)) || {}) };
        } catch {
          return { ...defaultCategoryLabels };
        }
      }

      function saveCategoryLabels() {
        localStorage.setItem(categoryLabelsStorageKey, JSON.stringify(categoryLabels));
      }

      function loadImportedQuestions() {
        try {
          return normalize(JSON.parse(localStorage.getItem(importedStorageKey)) || [], "quiz");
        } catch {
          return [];
        }
      }

      function saveImportedQuestions() {
        localStorage.setItem(importedStorageKey, JSON.stringify(importedQuestions));
      }

      function loadQuestionEdits() {
        try {
          return JSON.parse(localStorage.getItem(questionEditsStorageKey)) || {};
        } catch {
          return {};
        }
      }

      function saveQuestionEdits() {
        localStorage.setItem(questionEditsStorageKey, JSON.stringify(questionEdits));
      }

      function applyQuestionEdits(questions) {
        return questions.map((question) => {
          const edit = questionEdits[question.id];
          if (!edit) return question;
          return normalize([{ ...question, ...edit, id: question.id }], edit.category || question.category)[0];
        });
      }

      function loadDeletedQuestionIds() {
        try {
          return JSON.parse(localStorage.getItem(deletedQuestionsStorageKey)) || [];
        } catch {
          return [];
        }
      }

      function saveDeletedQuestionIds() {
        localStorage.setItem(deletedQuestionsStorageKey, JSON.stringify([...deletedQuestionIds]));
      }

      function visibleQuestions(questions) {
        return questions.filter((question) => !deletedQuestionIds.has(question.id));
      }

      function refreshQuestionData() {
        allQuestions = visibleQuestions(applyQuestionEdits([...quizQuestions, ...predictedQuestions, ...extraQuestions, ...importedQuestions]));
        validationIssues = validate(allQuestions);
        state.order = allQuestions.map((_, index) => index);
        if (state.index >= filtered().length) state.index = 0;
      }

      function makeImportedId(fileName, index) {
        const base = fileName
          .replace(/\.[^.]+$/, "")
          .replace(/[^\p{L}\p{N}]+/gu, "-")
          .replace(/^-|-$/g, "")
          .toLowerCase() || "import";
        return `import-${base}-${Date.now()}-${index + 1}`;
      }

      function splitList(value) {
        if (Array.isArray(value)) return value.map((item) => String(item).trim()).filter(Boolean);
        return String(value || "")
          .split(/\s*(?:\/|\||、|,)\s*/)
          .map((item) => item.trim())
          .filter(Boolean);
      }

      function questionFromRow(row, index, fileName, category) {
        const prompt = row.prompt || row.question || row.問題 || row.問題文 || row.q || "";
        const answer = row.answer || row.正解 || row.答え || row.a || "";
        const choices = row.choices || row.選択肢 || row.options || "";
        const images = row.images || row.画像 || "";
        const type = row.type || row.形式 || (choices ? "single" : "text");

        return normalize([{
          id: row.id || makeImportedId(fileName, index),
          source: row.source || row.範囲 || row.出典 || fileName.replace(/\.[^.]+$/, ""),
          category: row.category || category,
          number: Number(row.number || row.番号 || index + 1),
          prompt,
          answer,
          type,
          choices: splitList(choices),
          images: splitList(images)
        }], category)[0];
      }

      function parseCsv(text) {
        const rows = [];
        let current = "";
        let row = [];
        let quoted = false;

        for (let i = 0; i < text.length; i += 1) {
          const char = text[i];
          const next = text[i + 1];

          if (char === '"' && quoted && next === '"') {
            current += '"';
            i += 1;
          } else if (char === '"') {
            quoted = !quoted;
          } else if (char === "," && !quoted) {
            row.push(current);
            current = "";
          } else if ((char === "\n" || char === "\r") && !quoted) {
            if (char === "\r" && next === "\n") i += 1;
            row.push(current);
            if (row.some((cell) => cell.trim())) rows.push(row);
            row = [];
            current = "";
          } else {
            current += char;
          }
        }

        row.push(current);
        if (row.some((cell) => cell.trim())) rows.push(row);
        return rows;
      }

      function parseCsvQuestions(text, fileName, category) {
        const rows = parseCsv(text);
        if (rows.length < 2) return [];
        const headers = rows[0].map((header) => header.trim());
        return rows.slice(1).map((cells, index) => {
          const row = {};
          headers.forEach((header, cellIndex) => {
            row[header] = cells[cellIndex] || "";
          });
          return questionFromRow(row, index, fileName, category);
        });
      }

      function parseMarkdownTableQuestions(text, fileName, category) {
        const tableRows = text
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter((line) => line.startsWith("|") && line.endsWith("|"))
          .map((line) => line.slice(1, -1).split("|").map((cell) => cell.trim()));

        if (tableRows.length < 2) return [];
        const headers = tableRows[0];
        const body = tableRows.slice(1).filter((row) => !row.every((cell) => /^:?-{3,}:?$/.test(cell)));
        return body.map((cells, index) => {
          const row = {};
          headers.forEach((header, cellIndex) => {
            row[header] = cells[cellIndex] || "";
          });
          return questionFromRow(row, index, fileName, category);
        });
      }

      function stripHtml(text) {
        return text
          .replace(/<script[\s\S]*?<\/script>/gi, " ")
          .replace(/<style[\s\S]*?<\/style>/gi, " ")
          .replace(/<br\s*\/?>/gi, "\n")
          .replace(/<\/p>|<\/div>|<\/li>|<\/h[1-6]>/gi, "\n")
          .replace(/<[^>]+>/g, " ")
          .replace(/&nbsp;/g, " ")
          .replace(/&amp;/g, "&")
          .replace(/&lt;/g, "<")
          .replace(/&gt;/g, ">")
          .replace(/\n{3,}/g, "\n\n");
      }

      function parseQaTextQuestions(text, fileName, category) {
        const source = fileName.replace(/\.[^.]+$/, "");
        const blocks = text.split(/\n\s*\n/).map((block) => block.trim()).filter(Boolean);
        const questions = [];

        blocks.forEach((block) => {
          const qMatch = block.match(/(?:^|\n)\s*(?:Q|問題|問)[:：]\s*([\s\S]*?)(?=\n\s*(?:A|答え|解答|正解)[:：]|$)/i);
          const aMatch = block.match(/(?:^|\n)\s*(?:A|答え|解答|正解)[:：]\s*([\s\S]*)/i);
          if (qMatch && aMatch) {
            questions.push({
              prompt: qMatch[1].trim(),
              answer: aMatch[1].trim(),
              type: "text",
              choices: []
            });
          }
        });

        if (!questions.length) {
          text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean).forEach((line) => {
            const blank = line.match(/(.+?)[（(]\s*([^)）]+)\s*[)）](.*)/);
            if (blank) {
              questions.push({
                prompt: `${blank[1]}（　）${blank[3]}`,
                answer: blank[2],
                type: "text",
                choices: []
              });
            }
          });
        }

        return questions.map((question, index) => normalize([{
          id: makeImportedId(fileName, index),
          source,
          category,
          number: index + 1,
          images: [],
          ...question
        }], category)[0]);
      }

      function normalizeSlideText(text) {
        return stripHtml(text)
          .replace(/[ \t]+/g, " ")
          .replace(/\n{3,}/g, "\n\n")
          .trim();
      }

      function isUsefulSlideLine(line) {
        const cleaned = line.trim();
        if (cleaned.length < 5) return false;
        if (/^\d+$/.test(cleaned)) return false;
        if (/^(http|www\.)/i.test(cleaned)) return false;
        if (/^(第\d+回|授業|講義|スライド|page|p\.)\s*\d*$/i.test(cleaned)) return false;
        return true;
      }

      function extractKeyTerm(line) {
        const definitionPatterns = [
          /^(.{2,24}?)(?:とは|とは、|とは:|とは：)/,
          /^(.{2,24}?)(?:は|：|:)\s*(?:[^。]{6,})$/,
          /「([^」]{2,24})」/,
          /『([^』]{2,24})』/
        ];

        for (const pattern of definitionPatterns) {
          const match = line.match(pattern);
          if (match) return match[1].replace(/[「」『』()（）]/g, "").trim();
        }

        const bracket = line.match(/[（(]([^（）()]{2,24})[)）]/);
        if (bracket) return bracket[1].trim();

        return "";
      }

      function uniqueQuestions(questions) {
        const seen = new Set();
        return questions.filter((question) => {
          const key = `${question.prompt}|${question.answer}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }

      function parseSlideQuestions(text, fileName) {
        const source = fileName.replace(/\.[^.]+$/, "");
        const cleaned = normalizeSlideText(text);
        const lines = cleaned.split(/\r?\n/).map((line) => line.trim()).filter(isUsefulSlideLine);
        const questions = [];

        lines.forEach((line) => {
          const blankMatches = [...line.matchAll(/[（(]([^（）()]{2,30})[)）]/g)];
          blankMatches.forEach((match) => {
            const answer = match[1].trim();
            if (!answer || /上昇|下落|増加|減少|右|左/.test(answer) && line.length < 10) return;
            questions.push({
              prompt: line.replace(match[0], "（　）"),
              answer,
              type: "text",
              choices: []
            });
          });

          const term = extractKeyTerm(line);
          if (term && line.length >= 12) {
            questions.push({
              prompt: `次の説明に当てはまる語句を答えなさい。\n${line.replace(term, "（　）")}`,
              answer: term,
              type: "text",
              choices: []
            });
          }
        });

        const compactLines = lines.filter((line) => line.length >= 8 && line.length <= 70);
        compactLines.slice(0, 20).forEach((line) => {
          const term = extractKeyTerm(line);
          if (!term) return;
          questions.push({
            prompt: `${term}について、最も近い説明を選びなさい。`,
            answer: line,
            type: "single",
            choices: uniqueQuestions([line, ...compactLines.filter((item) => item !== line).slice(0, 3)].map((choice, index) => ({
              prompt: String(index),
              answer: choice
            }))).map((item) => item.answer)
          });
        });

        return uniqueQuestions(questions).map((question, index) => normalize([{
          id: makeImportedId(fileName, index),
          source: `予想 ${source}`,
          category: "prediction",
          number: index + 1,
          images: [],
          ...question
        }], "prediction")[0]);
      }

      function extractArrayFromJs(text, name) {
        const marker = `window.${name}`;
        const start = text.indexOf(marker);
        if (start === -1) return null;
        const eq = text.indexOf("=", start);
        const arrayStart = text.indexOf("[", eq);
        if (eq === -1 || arrayStart === -1) return null;

        let depth = 0;
        let inString = false;
        let quote = "";
        let escaped = false;

        for (let i = arrayStart; i < text.length; i += 1) {
          const char = text[i];
          if (inString) {
            if (escaped) escaped = false;
            else if (char === "\\") escaped = true;
            else if (char === quote) inString = false;
          } else if (char === '"' || char === "'") {
            inString = true;
            quote = char;
          } else if (char === "[") {
            depth += 1;
          } else if (char === "]") {
            depth -= 1;
            if (depth === 0) return text.slice(arrayStart, i + 1);
          }
        }

        return null;
      }

      function categoryForFileKind(fileKind, selectedCategory) {
        if (fileKind === "quiz") return "quiz";
        if (fileKind === "slides") return "prediction";
        return selectedCategory;
      }

      function parseQuestionFile(text, fileName, category, fileKind) {
        const lower = fileName.toLowerCase();
        const cleanedText = lower.endsWith(".html") || lower.endsWith(".htm") ? stripHtml(text) : text;
        const resolvedCategory = categoryForFileKind(fileKind, category);

        if (fileKind === "slides") {
          return parseSlideQuestions(cleanedText, fileName);
        }

        if (lower.endsWith(".json")) {
          const parsed = JSON.parse(text);
          const items = Array.isArray(parsed) ? parsed : parsed.questions || parsed.data || [];
          return normalize(items, resolvedCategory);
        }

        if (lower.endsWith(".js")) {
          const arrayText = extractArrayFromJs(text, "QUESTION_DATA") || extractArrayFromJs(text, "PREDICTED_QUESTION_DATA");
          if (!arrayText) return [];
          return normalize(JSON.parse(arrayText), resolvedCategory);
        }

        if (lower.endsWith(".csv")) return parseCsvQuestions(text, fileName, resolvedCategory);

        const tableQuestions = parseMarkdownTableQuestions(cleanedText, fileName, resolvedCategory);
        if (tableQuestions.length) return tableQuestions;

        return parseQaTextQuestions(cleanedText, fileName, resolvedCategory);
      }

      function addImportedQuestions(questions, label, fileKind = el.fileKind.value) {
        const category = categoryForFileKind(fileKind, el.importCategory.value);
        const normalized = normalize(questions, category)
          .filter((question) => String(question.prompt).trim() && String(question.answer).trim());

        importedQuestions = [...importedQuestions, ...normalized];
        saveImportedQuestions();
        refreshQuestionData();
        state.category = "all";
        state.source = "all";
        state.index = 0;
        state.revealed = false;
        el.importStatus.textContent = `${label}: ${normalized.length}問を${categoryLabels[category]}に追加しました。`;
        render();
      }

      async function importFiles(files) {
        let added = [];
        for (const file of files) {
          const text = await file.text();
          added = [...added, ...parseQuestionFile(text, file.name, el.importCategory.value, el.fileKind.value)];
        }
        addImportedQuestions(added, `${files.length}ファイル`, el.fileKind.value);
        el.fileInput.value = "";
      }

      function parseMatchingAnswer(answer) {
        return String(answer)
          .split("/")
          .map((part) => part.trim())
          .filter(Boolean)
          .map((part) => {
            const [label, value] = part.split("=").map((item) => item.trim());
            return { label, value };
          });
      }

      function parseChoice(choice) {
        const match = String(choice).match(/^([^:]+):\s*(.*)$/);
        return match ? { key: match[1], label: match[2] } : { key: choice, label: choice };
      }

      function validate(questions) {
        const issues = [];
        const ids = new Set();

        questions.forEach((question, index) => {
          const label = question.id || `${index + 1}問目`;

          if (!question.id) issues.push(`${label}: id が空です。`);
          if (ids.has(question.id)) issues.push(`${label}: id が重複しています。`);
          ids.add(question.id);
          if (!String(question.prompt).trim()) issues.push(`${label}: prompt が空です。`);
          if (!String(question.answer).trim()) issues.push(`${label}: answer が空です。`);
          if (!supportedTypes.includes(question.type)) issues.push(`${label}: type が未対応です。`);
          if ((question.type === "single" || question.type === "multiple") && !question.choices.length) {
            issues.push(`${label}: ${question.type} には choices が必要です。`);
          }
          if (question.type === "matching") {
            const pairs = parseMatchingAnswer(question.answer);
            if (!pairs.length || pairs.some((pair) => !pair.label || !pair.value)) {
              issues.push(`${label}: matching の answer は「① = 用語 / ② = 用語」形式にしてください。`);
            }
          }
          question.images.forEach((src) => {
            if (!src || typeof src !== "string") issues.push(`${label}: images に空の値があります。`);
          });
        });

        return issues;
      }

      function getResponse(question) {
        if (!state.responses[question.id]) {
          state.responses[question.id] = { selected: [], matching: {}, text: "", checked: false, correct: false };
        }
        return state.responses[question.id];
      }

      function normalizeAnswer(value) {
        return String(value).trim().replace(/\s+/g, "").toLowerCase();
      }

      function correctValues(question) {
        if (question.type === "multiple") return String(question.answer).split("/").map((item) => item.trim()).filter(Boolean);
        return [String(question.answer).trim()];
      }

      function sameSet(a, b) {
        return a.length === b.length && a.every((item) => b.includes(item));
      }

      function canCheckAnswer(question) {
        const response = getResponse(question);
        if (question.type === "single" || question.type === "multiple") return response.selected.length > 0;
        if (question.type === "matching") {
          return parseMatchingAnswer(question.answer).every((pair) => response.matching[pair.label]);
        }
        if (question.type === "text") return response.text.trim().length > 0;
        return question.type === "free";
      }

      function judge(question) {
        const response = getResponse(question);
        let correct = false;

        if (question.type === "free" || String(question.answer).includes("保存された解答なし")) {
          response.checked = true;
          response.correct = null;
          render();
          return;
        }

        if (question.type === "matching") {
          correct = parseMatchingAnswer(question.answer).every((pair) => response.matching[pair.label] === pair.value);
        } else if (question.type === "multiple") {
          correct = sameSet(
            response.selected.map(normalizeAnswer).sort(),
            correctValues(question).map(normalizeAnswer).sort()
          );
        } else if (question.type === "text" || question.type === "free") {
          correct = normalizeAnswer(response.text) === normalizeAnswer(question.answer);
        } else {
          correct = normalizeAnswer(response.selected[0] || "") === normalizeAnswer(question.answer);
        }

        response.checked = true;
        response.correct = correct;
        state.progress[question.id] = correct ? "known" : "review";
        saveProgress();
        render();
      }

      function filtered() {
        const query = state.query.trim().toLowerCase();
        return state.order
          .map((index) => allQuestions[index])
          .filter((question) => {
            const status = state.progress[question.id] || "new";
            const text = `${question.prompt} ${question.answer} ${question.source}`.toLowerCase();
            return (state.category === "all" || question.category === state.category)
              && (state.source === "all" || question.source === state.source)
              && (state.type === "all" || question.type === state.type)
              && (state.status === "all" || status === state.status)
              && (!query || text.includes(query));
          });
      }

      function option(value, label) {
        const item = document.createElement("option");
        item.value = value;
        item.textContent = label;
        return item;
      }

      function unique(values) {
        return [...new Set(values)];
      }

      function setOptions(select, current, entries) {
        select.replaceChildren(...entries.map(([value, label]) => option(value, label)));
        select.value = current;
      }

      function categoryEntries() {
        const values = unique(allQuestions.map((question) => question.category));
        return values.map((category) => [category, categoryLabels[category] || category]);
      }

      function renderFilters() {
        setOptions(el.categoryFilter, state.category, [
          ["all", "すべて"],
          ...categoryEntries()
        ]);

        setOptions(el.importCategory, el.importCategory.value || "quiz", [
          ...categoryEntries()
        ]);

        const sourceQuestions = allQuestions.filter((question) => state.category === "all" || question.category === state.category);
        setOptions(el.sourceFilter, state.source, [
          ["all", "すべて"],
          ...unique(sourceQuestions.map((question) => question.source)).map((source) => [source, source])
        ]);

        setOptions(el.typeFilter, state.type, [
          ["all", "すべて"],
          ...unique(allQuestions.map((question) => question.type)).map((type) => [type, typeLabels[type] || type])
        ]);

        setOptions(el.statusFilter, state.status, [
          ["all", "すべて"],
          ["new", "未着手"],
          ["known", "習得"],
          ["review", "復習"]
        ]);
      }

      function renderCategoryNameInputs() {
        el.categoryEditorPanel.classList.toggle("hidden", !state.categoryEditing || state.mode !== "list");
        el.toggleCategoryEditorButton.textContent = state.categoryEditing ? "カテゴリ名編集を閉じる" : "カテゴリ名を編集";
        el.quizCategoryField.classList.toggle("hidden", state.category !== "all" && state.category !== "quiz");
        el.predictionCategoryField.classList.toggle("hidden", state.category !== "all" && state.category !== "prediction");
        el.audioCategoryField.classList.toggle("hidden", state.category !== "all" && state.category !== "audio");
        el.quizCategoryName.value = categoryLabels.quiz;
        el.predictionCategoryName.value = categoryLabels.prediction;
        el.audioCategoryName.value = categoryLabels.audio;
      }

      function renderDeletePanel() {
        el.deletePanel.classList.toggle("hidden", !state.deleteMode || state.mode !== "list");
        el.toggleDeleteModeButton.textContent = state.deleteMode ? "まとめて削除を閉じる" : "まとめて削除";
        el.deleteSelectedButton.disabled = state.selectedDeleteIds.size === 0;
        el.deleteStatus.textContent = state.deleteMode ? `${state.selectedDeleteIds.size}問を選択中` : "";
      }

      function renderStatus(items) {
        const known = allQuestions.filter((question) => state.progress[question.id] === "known").length;
        const review = allQuestions.filter((question) => state.progress[question.id] === "review").length;
        el.totalCount.textContent = `${items.length}/${allQuestions.length}問`;
        el.knownCount.textContent = `${known}習得`;
        el.reviewCount.textContent = `${review}復習`;

        el.dataStatus.hidden = false;
        el.dataStatus.className = `data-status ${validationIssues.length ? "bad" : "ok"}`;
        el.dataStatus.textContent = validationIssues.length ? `データ確認: ${validationIssues.length}件` : `データOK: ${allQuestions.length}問`;
        el.dataStatus.title = validationIssues.join("\n");
      }

      function renderQuiz(items) {
        if (!items.length) {
          el.meta.replaceChildren();
          el.images.replaceChildren();
          el.prompt.textContent = "条件に合う問題がありません。";
          el.choices.replaceChildren();
          el.feedback.className = "feedback hidden";
          el.answer.className = "answer hidden";
          el.answerButton.disabled = true;
          el.knownButton.disabled = true;
          el.reviewButton.disabled = true;
          el.prevButton.disabled = true;
          el.nextButton.disabled = true;
          return;
        }

        el.answerButton.disabled = false;
        el.knownButton.disabled = false;
        el.reviewButton.disabled = false;
        el.prevButton.disabled = false;
        el.nextButton.disabled = false;

        if (state.index >= items.length) state.index = 0;
        const question = items[state.index];
        const response = getResponse(question);
        const progress = state.progress[question.id] || "new";

        el.meta.replaceChildren(
          pill(question.source),
          pill(`${categoryLabels[question.category] || question.category} / ${typeLabels[question.type] || question.type}`),
          pill(`${state.index + 1} / ${items.length}`)
        );
        el.images.replaceChildren(...question.images.map((src) => {
          const img = document.createElement("img");
          img.src = src;
          img.alt = `${question.source}の図`;
          return img;
        }));
        el.prompt.textContent = question.prompt;
        renderInteraction(question, response);

        const feedbackClass = response.correct === null ? "neutral" : response.correct ? "ok" : "bad";
        const feedbackTitle = response.correct === null ? "模範解答" : response.correct ? "正解" : "不正解";
        const feedbackDetail = response.correct === null ? "答えを確認して、分かった・復習を選んでください。" : response.correct ? "その調子です。" : "正解を確認しましょう。";
        el.feedback.className = `feedback ${feedbackClass} ${response.checked ? "" : "hidden"}`;
        el.feedback.innerHTML = response.checked ? `<strong>${feedbackTitle}</strong><span>${feedbackDetail}</span>` : "";

        el.answer.className = `answer ${response.checked ? "" : "hidden"}`;
        el.answer.innerHTML = `<span>答え</span><strong>${question.answer || "解答なし"}</strong>`;
        el.answerButton.textContent = response.checked ? "もう一度答え合わせ" : "答え合わせ";
        el.answerButton.disabled = !canCheckAnswer(question);
        el.knownButton.classList.toggle("is-active", progress === "known");
        el.reviewButton.classList.toggle("is-active", progress === "review");
      }

      function pill(text) {
        const span = document.createElement("span");
        span.className = "pill";
        span.textContent = text;
        return span;
      }

      function listText(values) {
        return (Array.isArray(values) ? values : []).join("\n");
      }

      function fieldList(value) {
        return String(value || "")
          .split(/\r?\n/)
          .map((item) => item.trim())
          .filter(Boolean);
      }

      function makeLabeledControl(labelText, control) {
        const wrapper = document.createElement("div");
        const label = document.createElement("label");
        label.textContent = labelText;
        wrapper.append(label, control);
        return wrapper;
      }

      function createInput(value, type = "text") {
        const input = document.createElement("input");
        input.type = type;
        input.value = value;
        return input;
      }

      function createTextarea(value, placeholder = "") {
        const textarea = document.createElement("textarea");
        textarea.value = value;
        textarea.placeholder = placeholder;
        return textarea;
      }

      function createSelect(entries, value) {
        const select = document.createElement("select");
        select.replaceChildren(...entries.map(([optionValue, label]) => option(optionValue, label)));
        select.value = value;
        return select;
      }

      function createInlineQuestionEditor(question) {
        const section = document.createElement("section");
        section.className = "editor-panel";

        const grid = document.createElement("div");
        grid.className = "editor-grid";

        const source = createInput(question.source);
        const category = createSelect([
          ...categoryEntries()
        ], question.category);
        const type = createSelect(supportedTypes.map((item) => [item, typeLabels[item] || item]), question.type);
        const number = createInput(question.number || 1, "number");
        number.min = "1";
        const prompt = createTextarea(question.prompt);
        const answer = createTextarea(question.answer);
        const choices = createTextarea(listText(question.choices), "1行に1つずつ入力");
        const images = createTextarea(listText(question.images), "assets/example.png のように1行に1つずつ入力");

        const promptField = makeLabeledControl("問題文", prompt);
        promptField.className = "editor-field-wide";
        const answerField = makeLabeledControl("答え", answer);
        answerField.className = "editor-field-wide";
        const choicesField = makeLabeledControl("選択肢", choices);
        choicesField.className = "editor-field-wide";
        const imagesField = makeLabeledControl("画像", images);
        imagesField.className = "editor-field-wide";

        grid.append(
          makeLabeledControl("範囲", source),
          makeLabeledControl("カテゴリ", category),
          makeLabeledControl("形式", type),
          makeLabeledControl("番号", number),
          promptField,
          answerField,
          choicesField,
          imagesField
        );

        const actions = document.createElement("div");
        actions.className = "editor-actions";
        const save = document.createElement("button");
        save.type = "button";
        save.className = "primary";
        save.textContent = "問題を保存";
        const cancel = document.createElement("button");
        cancel.type = "button";
        cancel.textContent = "閉じる";
        const reset = document.createElement("button");
        reset.type = "button";
        reset.textContent = "元に戻す";

        save.addEventListener("click", () => {
          const edited = normalize([{
            ...question,
            source: source.value.trim() || "未分類",
            category: category.value,
            number: Number(number.value || question.number || 1),
            prompt: prompt.value.trim(),
            answer: answer.value.trim(),
            type: type.value,
            choices: fieldList(choices.value),
            images: fieldList(images.value)
          }], category.value)[0];
          questionEdits[question.id] = {
            source: edited.source,
            category: edited.category,
            number: edited.number,
            prompt: edited.prompt,
            answer: edited.answer,
            type: edited.type,
            choices: edited.choices,
            images: edited.images
          };
          saveQuestionEdits();
          refreshQuestionData();
          state.editingId = question.id;
          state.revealed = false;
          delete state.responses[question.id];
          render();
        });

        cancel.addEventListener("click", () => {
          state.editingId = "";
          render();
        });

        reset.addEventListener("click", () => {
          delete questionEdits[question.id];
          saveQuestionEdits();
          refreshQuestionData();
          state.editingId = "";
          state.revealed = false;
          render();
        });

        actions.append(save, cancel, reset);
        section.append(grid, actions);
        return section;
      }

      function renderInteraction(question, response) {
        el.choices.replaceChildren();

        if (question.type === "single" || question.type === "multiple") {
          question.choices.forEach((choice) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = `choice ${response.selected.includes(choice) ? "is-selected" : ""}`;
            button.textContent = choice;
            button.addEventListener("click", () => {
              response.checked = false;
              state.revealed = false;
              response.selected = question.type === "single"
                ? [choice]
                : response.selected.includes(choice)
                  ? response.selected.filter((item) => item !== choice)
                  : [...response.selected, choice];
              render();
            });
            el.choices.appendChild(button);
          });
          return;
        }

        if (question.type === "matching") {
          const choices = question.choices.map(parseChoice);
          parseMatchingAnswer(question.answer).forEach((pair) => {
            const row = document.createElement("div");
            row.className = "matching-row";
            const label = document.createElement("span");
            label.className = "matching-label";
            label.textContent = pair.label;
            const options = document.createElement("div");
            options.className = "matching-options";
            choices.forEach((choice) => {
              const button = document.createElement("button");
              button.type = "button";
              button.className = `choice ${response.matching[pair.label] === choice.label ? "is-selected" : ""}`;
              button.textContent = choice.label;
              button.addEventListener("click", () => {
                response.checked = false;
                response.matching[pair.label] = choice.label;
                render();
              });
              options.appendChild(button);
            });
            row.append(label, options);
            el.choices.appendChild(row);
          });
          return;
        }

        const input = document.createElement("input");
        input.type = "text";
        input.value = response.text;
        input.placeholder = "答えを入力";
        input.addEventListener("input", (event) => {
          response.checked = false;
          response.text = event.target.value;
        });
        input.addEventListener("keydown", (event) => {
          if (event.key === "Enter" && response.text.trim()) judge(question);
        });
        el.choices.append(input);
      }

      function renderList(items) {
        el.listItems.replaceChildren(...items.map((question) => {
          const card = document.createElement("article");
          card.className = "list-card";
          if (state.deleteMode) {
            const select = document.createElement("label");
            select.className = "helper";
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = state.selectedDeleteIds.has(question.id);
            checkbox.addEventListener("change", () => {
              if (checkbox.checked) {
                state.selectedDeleteIds.add(question.id);
              } else {
                state.selectedDeleteIds.delete(question.id);
              }
              renderDeletePanel();
            });
            select.append(checkbox, " 削除対象にする");
            card.appendChild(select);
          }
          const title = document.createElement("h2");
          title.textContent = `${categoryLabels[question.category] || question.category} / ${question.source} / ${typeLabels[question.type] || question.type}`;
          const prompt = document.createElement("p");
          prompt.textContent = question.prompt;
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = "答えを確認";
          const editButton = document.createElement("button");
          editButton.type = "button";
          editButton.textContent = "編集";
          const answer = document.createElement("p");
          answer.className = "hidden";
          answer.textContent = `答え: ${question.answer}`;
          button.addEventListener("click", () => {
            answer.classList.toggle("hidden");
            button.textContent = answer.classList.contains("hidden") ? "答えを確認" : "答えを閉じる";
          });
          editButton.addEventListener("click", () => {
            state.editingId = state.editingId === question.id ? "" : question.id;
            render();
          });
          card.append(title, prompt, button, editButton, answer);
          if (state.editingId === question.id) {
            card.appendChild(createInlineQuestionEditor(question));
          }
          return card;
        }));
      }

      function deleteSelectedQuestions() {
        if (!state.selectedDeleteIds.size) return;
        state.selectedDeleteIds.forEach((id) => {
          deletedQuestionIds.add(id);
          delete state.progress[id];
          delete state.responses[id];
        });
        saveDeletedQuestionIds();
        saveProgress();
        state.selectedDeleteIds.clear();
        state.editingId = "";
        refreshQuestionData();
        el.deleteStatus.textContent = "選択した問題を削除しました。";
        render();
      }

      function restoreDeletedQuestions() {
        deletedQuestionIds = new Set();
        saveDeletedQuestionIds();
        state.selectedDeleteIds.clear();
        refreshQuestionData();
        el.deleteStatus.textContent = "削除を全解除しました。";
        render();
      }

      function move(delta) {
        const items = filtered();
        if (!items.length) return;
        state.index = (state.index + delta + items.length) % items.length;
        state.revealed = false;
        state.editingId = "";
        state.selectedDeleteIds.clear();
        render();
      }

      function mark(status) {
        const question = filtered()[state.index];
        if (!question) return;
        if (state.progress[question.id] === status) {
          delete state.progress[question.id];
        } else {
          state.progress[question.id] = status;
        }
        saveProgress();
        render();
      }

      function render() {
        const items = filtered();
        renderFilters();
        renderStatus(items);
        renderCategoryNameInputs();
        renderDeletePanel();
        el.quizView.classList.toggle("hidden", state.mode !== "quiz");
        el.listView.classList.toggle("hidden", state.mode !== "list");
        el.quizMode.classList.toggle("is-active", state.mode === "quiz");
        el.listMode.classList.toggle("is-active", state.mode === "list");
        renderQuiz(items);
        renderList(items);
      }

      function updateFilter(key, value) {
        state[key] = value;
        state.index = 0;
        state.revealed = false;
        state.editingId = "";
        render();
      }

      el.searchInput.addEventListener("input", (event) => updateFilter("query", event.target.value));
      el.fileKind.addEventListener("change", () => {
        if (el.fileKind.value === "quiz") el.importCategory.value = "quiz";
        if (el.fileKind.value === "slides") el.importCategory.value = "prediction";
        el.importStatus.textContent = el.fileKind.value === "slides"
          ? "授業スライドは予想問題として追加されます。"
          : "";
        render();
      });
      el.fileInput.addEventListener("change", (event) => {
        importFiles([...event.target.files]).catch((error) => {
          el.importStatus.textContent = `読み込みに失敗しました: ${error.message}`;
        });
      });
      el.pasteButton.addEventListener("click", () => {
        try {
          const text = el.pasteInput.value.trim();
          if (!text) {
            el.importStatus.textContent = "貼り付け欄が空です。";
            return;
          }
          const questions = parseQuestionFile(text, "貼り付けデータ.txt", el.importCategory.value, el.fileKind.value);
          addImportedQuestions(questions, "貼り付け", el.fileKind.value);
          el.pasteInput.value = "";
        } catch (error) {
          el.importStatus.textContent = `読み込みに失敗しました: ${error.message}`;
        }
      });
      el.clearImportedButton.addEventListener("click", () => {
        importedQuestions = [];
        saveImportedQuestions();
        refreshQuestionData();
        state.index = 0;
        state.revealed = false;
        state.editingId = "";
        el.importStatus.textContent = "追加データを削除しました。";
        render();
      });
      el.toggleCategoryEditorButton.addEventListener("click", () => {
        state.categoryEditing = !state.categoryEditing;
        el.categoryStatus.textContent = "";
        render();
      });
      el.toggleDeleteModeButton.addEventListener("click", () => {
        state.deleteMode = !state.deleteMode;
        state.selectedDeleteIds.clear();
        state.editingId = "";
        render();
      });
      el.selectVisibleButton.addEventListener("click", () => {
        filtered().forEach((question) => state.selectedDeleteIds.add(question.id));
        render();
      });
      el.deleteSelectedButton.addEventListener("click", deleteSelectedQuestions);
      el.restoreDeletedButton.addEventListener("click", restoreDeletedQuestions);
      el.saveCategoryNamesButton.addEventListener("click", () => {
        categoryLabels = {
          quiz: el.quizCategoryName.value.trim() || defaultCategoryLabels.quiz,
          prediction: el.predictionCategoryName.value.trim() || defaultCategoryLabels.prediction,
          audio: el.audioCategoryName.value.trim() || defaultCategoryLabels.audio
        };
        saveCategoryLabels();
        el.categoryStatus.textContent = "カテゴリ名を保存しました。";
        render();
      });
      el.resetCategoryNamesButton.addEventListener("click", () => {
        categoryLabels = { ...defaultCategoryLabels };
        saveCategoryLabels();
        el.categoryStatus.textContent = "カテゴリ名を戻しました。";
        render();
      });
      el.categoryFilter.addEventListener("change", (event) => {
        state.source = "all";
        updateFilter("category", event.target.value);
      });
      el.sourceFilter.addEventListener("change", (event) => updateFilter("source", event.target.value));
      el.typeFilter.addEventListener("change", (event) => updateFilter("type", event.target.value));
      el.statusFilter.addEventListener("change", (event) => updateFilter("status", event.target.value));
      el.quizMode.addEventListener("click", () => updateFilter("mode", "quiz"));
      el.listMode.addEventListener("click", () => updateFilter("mode", "list"));
      el.shuffleButton.addEventListener("click", () => {
        state.order = state.order.map((value) => [Math.random(), value]).sort((a, b) => a[0] - b[0]).map((pair) => pair[1]);
        state.index = 0;
        state.revealed = false;
        render();
      });
      el.prevButton.addEventListener("click", () => move(-1));
      el.nextButton.addEventListener("click", () => move(1));
      el.answerButton.addEventListener("click", () => {
        const question = filtered()[state.index];
        if (!question || !canCheckAnswer(question)) return;
        judge(question);
      });
      el.knownButton.addEventListener("click", () => mark("known"));
      el.reviewButton.addEventListener("click", () => mark("review"));

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js").catch(() => {}));
      }

      render();
    </script>
  </body>
</html>
