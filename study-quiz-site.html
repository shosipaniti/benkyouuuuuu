<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>汎用学習クイズ</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f5ef;
        --surface: #ffffff;
        --ink: #202724;
        --muted: #66706b;
        --line: #d9ddd8;
        --accent: #156b5e;
        --blue: #2d5f91;
        --orange: #b9602c;
        --ok: #1f6b3b;
        --bad: #943b29;
        --shadow: 0 18px 42px rgba(32, 39, 36, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "YuGothic", "Segoe UI", sans-serif;
        line-height: 1.65;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 2px 5px rgba(42, 52, 49, 0.12);
        color: var(--ink);
        padding: 0 14px;
        cursor: pointer;
        transform: translateY(0);
        transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.08s ease, background-color 0.15s ease;
      }

      button:hover {
        border-color: var(--accent);
        box-shadow: 0 4px 10px rgba(42, 52, 49, 0.14);
      }

      button:active:not(:disabled) {
        box-shadow: 0 1px 3px rgba(42, 52, 49, 0.16);
        transform: translateY(1px) scale(0.99);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
        box-shadow: none;
        transform: none;
      }

      .primary,
      .is-active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
        padding: 26px clamp(16px, 4vw, 46px) 18px;
        border-bottom: 1px solid var(--line);
      }

      .eyebrow {
        margin: 0 0 2px;
        color: var(--orange);
        font-size: 0.78rem;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.55rem, 3vw, 2.25rem);
        line-height: 1.15;
        letter-spacing: 0;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        padding: 3px 10px;
        color: var(--muted);
        font-size: 0.86rem;
        white-space: nowrap;
      }

      main {
        display: grid;
        grid-template-columns: minmax(172px, 220px) 1fr;
        gap: 16px;
        padding: 20px clamp(14px, 4vw, 38px) 42px;
      }

      aside,
      .quiz-card,
      .list-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      aside {
        position: sticky;
        top: 16px;
        align-self: start;
        padding: 10px;
      }

      label,
      .filter-title {
        display: block;
        margin: 0 0 4px;
        color: var(--muted);
        font-size: 0.74rem;
        font-weight: 700;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        padding: 5px 8px;
        font-size: 0.9rem;
      }

      textarea {
        min-height: 92px;
        resize: vertical;
      }

      .filter {
        margin-top: 10px;
      }

      .detail-filters summary {
        cursor: pointer;
        color: var(--ink);
        font-size: 0.88rem;
        font-weight: 800;
      }

      .detail-filters summary::marker {
        color: var(--accent);
      }

      .active-set-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        padding: 12px 14px;
      }

      .active-set-name {
        display: block;
        margin-top: 2px;
        font-size: 1.04rem;
      }

      .active-set-counts {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
      }

      .set-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      .set-chooser {
        display: grid;
        gap: 14px;
        margin-bottom: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        padding: clamp(16px, 3vw, 24px);
        box-shadow: var(--shadow);
      }

      .set-chooser-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .set-chooser-header h2 {
        margin: 0;
        font-size: 1.18rem;
      }

      .set-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px;
      }

      .set-card {
        display: grid;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        padding: 12px;
      }

      .set-card.is-archived {
        background: #f8faf7;
      }

      .set-card h3 {
        margin: 0;
        font-size: 1rem;
      }

      .set-card-meta {
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
      }

      .set-card-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .set-empty {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .import-panel {
        display: block;
        margin-top: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        padding: 10px 12px;
      }

      .import-panel summary {
        cursor: pointer;
        color: var(--ink);
        font-size: 0.88rem;
        font-weight: 800;
      }

      .import-panel summary::marker {
        color: var(--accent);
      }

      .import-panel-body {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-top: 12px;
      }

      .import-panel button {
        width: auto;
      }

      .import-panel-body .filter-title,
      .import-panel-body input[type="file"],
      .import-panel-body textarea,
      .import-panel-body .helper,
      .import-panel-body .import-status,
      .import-panel-body .data-status {
        grid-column: 1 / -1;
      }

      .helper {
        margin: 0;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.5;
      }

      .import-status {
        margin: 0;
        color: var(--accent);
        font-size: 0.84rem;
        font-weight: 700;
        min-height: 1.4em;
      }

      .category-editor-list {
        display: grid;
        gap: 10px;
      }

      .category-row {
        display: grid;
        grid-template-columns: 30px 34px minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
        background: #fff;
      }

      .category-row.is-dragging {
        opacity: 0.55;
      }

      .category-row.is-drag-over {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }

      .category-drag-handle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 30px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
        color: var(--muted);
        cursor: grab;
        font-weight: 800;
      }

      .category-drag-handle:active {
        cursor: grabbing;
      }

      .category-rank {
        color: var(--muted);
        font-size: 0.84rem;
        font-weight: 700;
        text-align: center;
      }

      .category-controls {
        display: flex;
        gap: 6px;
      }

      .category-controls button {
        min-width: 42px;
        padding: 0 8px;
      }


      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .segmented {
        display: inline-flex;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .segmented button {
        border: 0;
        border-radius: 0;
        min-width: 88px;
      }

      .quiz-card {
        box-shadow: var(--shadow);
        padding: clamp(18px, 4vw, 32px);
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 18px;
      }

      .question {
        margin: 0;
        white-space: pre-line;
        font-size: clamp(1.08rem, 2vw, 1.32rem);
        line-height: 1.8;
      }

      .images {
        display: grid;
        gap: 12px;
        margin-bottom: 18px;
      }

      .images img {
        width: min(100%, 680px);
        max-height: 420px;
        object-fit: contain;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .choices {
        display: grid;
        gap: 9px;
        margin-top: 20px;
      }

      .choice {
        min-height: 46px;
        border: 1px solid #c8d8e9;
        border-left: 4px solid var(--blue);
        background: #f5f8fb;
        color: #243346;
        text-align: left;
      }

      .choice.is-selected {
        border-color: var(--blue);
        background: #dcecf7;
        color: #183759;
        font-weight: 700;
      }

      .matching-row {
        display: grid;
        grid-template-columns: 58px 1fr;
        gap: 10px;
        align-items: start;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        background: #fbfcfb;
      }

      .matching-label {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        border-radius: 6px;
        background: #edf5f1;
        color: var(--accent);
        font-weight: 700;
      }

      .matching-options {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .feedback,
      .answer,
      .data-status,
      .editor-panel {
        margin-top: 18px;
        border-radius: 8px;
        padding: 12px 14px;
      }

      .feedback strong,
      .feedback span,
      .answer span,
      .answer strong {
        display: block;
      }

      .feedback.ok,
      .data-status.ok {
        border: 1px solid #b7d8c3;
        background: #edf8f0;
        color: var(--ok);
      }

      .feedback.bad,
      .data-status.bad {
        border: 1px solid #efc1b6;
        background: #fff0ec;
        color: var(--bad);
      }

      .feedback.neutral {
        border: 1px solid #c8d8e9;
        background: #f5f8fb;
        color: #243346;
      }

      .feedback-answer {
        margin-top: 10px;
        border-top: 1px solid currentColor;
        padding-top: 10px;
      }

      .feedback-answer-label {
        font-size: 0.78rem;
        font-weight: 700;
      }

      .feedback-answer-value {
        margin-top: 4px;
        white-space: pre-line;
        font-size: 1.12rem;
        font-weight: 700;
      }

      .feedback-explanation .feedback-answer-value {
        font-size: 0.98rem;
        font-weight: 600;
        line-height: 1.55;
      }

      .answer {
        border-left: 5px solid var(--orange);
        background: #fff7f0;
      }

      .answer span {
        color: var(--orange);
        font-size: 0.78rem;
        font-weight: 700;
      }

      .answer strong {
        margin-top: 4px;
        white-space: pre-line;
        font-size: 1.12rem;
      }

      .editor-panel {
        display: grid;
        gap: 12px;
        border: 1px solid var(--line);
        background: #fbfcfb;
      }

      .editor-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .editor-field-wide {
        grid-column: 1 / -1;
      }

      .editor-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .editor-actions button {
        min-width: 110px;
      }

      .list-tools {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: flex-start;
        position: relative;
      }

      .tool-dropdown {
        position: relative;
      }

      .tool-dropdown > button {
        white-space: nowrap;
      }

      .tool-dropdown .editor-panel {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        z-index: 20;
        width: min(86vw, 620px);
        max-height: 68vh;
        overflow: auto;
        box-shadow: var(--shadow);
        margin-top: 0;
      }

      .category-delete-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .category-delete-list button {
        min-height: 36px;
      }

      .category-delete-list button.is-selected {
        border-color: var(--accent);
        background: var(--soft);
        color: var(--accent);
        font-weight: 800;
      }

      .actions {
        display: grid;
        grid-template-columns: 42px minmax(150px, 1fr) 42px minmax(82px, auto) minmax(82px, auto);
        gap: 8px;
        margin-top: 24px;
      }

      .icon {
        width: 42px;
        padding: 0;
        font-size: 1.15rem;
      }

      .list {
        display: grid;
        gap: 12px;
      }

      .list-card {
        padding: 16px;
      }

      .list-card h2 {
        margin: 0 0 8px;
        font-size: 1rem;
      }

      .list-card p {
        margin: 8px 0 0;
        white-space: pre-line;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 820px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        main {
          grid-template-columns: 1fr;
        }

        aside {
          position: static;
        }

        .toolbar {
          align-items: stretch;
          flex-direction: column;
        }

        .segmented,
        .toolbar button {
          width: 100%;
        }

        .actions {
          grid-template-columns: 42px 1fr 42px;
        }

        .active-set-bar,
        .set-chooser-header {
          align-items: stretch;
          flex-direction: column;
        }

        .set-actions,
        .set-card-actions {
          flex-direction: column;
        }

        .set-actions button,
        .set-card-actions button {
          width: 100%;
        }

        .actions .mark {
          grid-column: span 3;
        }

        .list-tools {
          display: grid;
        }

        .tool-dropdown .editor-panel {
          position: static;
          width: 100%;
          max-height: none;
          box-shadow: none;
          margin-top: 8px;
        }

        .editor-grid {
          grid-template-columns: 1fr;
        }

        .import-panel-body {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">Common JSON quiz format</p>
        <h1>汎用学習クイズ</h1>
      </div>
      <div class="stats" aria-live="polite">
        <span id="totalCount" class="pill">0問</span>
        <span id="knownCount" class="pill">0習得</span>
        <span id="reviewCount" class="pill">0復習</span>
      </div>
    </header>

    <main>
      <aside aria-label="詳細フィルター">
        <details id="filterDetails" class="detail-filters">
          <summary>詳細フィルタ</summary>

          <div class="filter">
            <label for="searchInput">検索</label>
            <input id="searchInput" type="search" placeholder="問題文・答えで検索">
          </div>

          <div class="filter">
            <label for="categoryFilter">問題区分</label>
            <select id="categoryFilter"></select>
          </div>

          <div class="filter">
            <label for="sourceFilter">範囲</label>
            <select id="sourceFilter"></select>
          </div>

          <div class="filter">
            <label for="typeFilter">形式</label>
            <select id="typeFilter"></select>
          </div>

          <div class="filter">
            <label for="statusFilter">進捗</label>
            <select id="statusFilter"></select>
          </div>
        </details>
      </aside>

      <section>
        <section id="setChooser" class="set-chooser hidden" aria-label="学習セット選択">
          <div class="set-chooser-header">
            <div>
              <p class="filter-title">学習セット</p>
              <h2>今勉強するテストを選ぶ</h2>
            </div>
            <button id="closeSetChooserButton" type="button">閉じる</button>
          </div>
          <div>
            <p class="filter-title">通常表示</p>
            <div id="setList" class="set-grid"></div>
          </div>
          <div>
            <p class="filter-title">アーカイブ</p>
            <div id="archivedSetList" class="set-grid"></div>
          </div>
        </section>

        <div id="activeSetBar" class="active-set-bar">
          <div>
            <span class="filter-title">現在の学習セット</span>
            <strong id="activeSetName" class="active-set-name">未選択</strong>
            <span id="activeSetCounts" class="active-set-counts">0問</span>
          </div>
          <div class="set-actions">
            <button id="changeSetButton" type="button">セット変更</button>
            <button id="archiveActiveSetButton" type="button">このテストを完了にする</button>
          </div>
        </div>

        <div id="mainToolbar" class="toolbar">
          <div class="segmented" aria-label="表示切替">
            <button id="quizMode" class="is-active" type="button">一問一答</button>
            <button id="listMode" type="button">一覧</button>
          </div>
          <button id="shuffleButton" type="button">シャッフル</button>
        </div>

        <section id="quizView">
          <article id="quizCard" class="quiz-card">
            <div id="meta" class="meta"></div>
            <div id="images" class="images"></div>
            <p id="prompt" class="question"></p>
            <div id="choices" class="choices"></div>
            <div id="feedback" class="feedback hidden"></div>
            <div id="answer" class="answer hidden"></div>
            <div class="actions">
              <button id="prevButton" class="icon" type="button" aria-label="前の問題">←</button>
              <button id="answerButton" class="primary" type="button">答え合わせ</button>
              <button id="nextButton" class="icon" type="button" aria-label="次の問題">→</button>
              <button id="knownButton" class="mark" type="button">分かった</button>
              <button id="reviewButton" class="mark" type="button">復習</button>
            </div>
          </article>
        </section>

        <section id="listView" class="list hidden">
          <section class="list-tools" aria-label="一覧編集">
            <div class="tool-dropdown">
              <button id="toggleCategoryEditorButton" type="button">カテゴリ名を編集</button>
              <section id="categoryEditorPanel" class="editor-panel hidden" aria-label="カテゴリ名編集">
                <p class="helper">上から順に問題区分フィルター、追加先、一問一答の出題順へ反映されます。名前もここで変更できます。</p>
                <div id="categoryEditorList" class="category-editor-list"></div>
                <div class="editor-actions">
                  <button id="saveCategoryNamesButton" class="primary" type="button">カテゴリ設定を保存</button>
                  <button id="resetCategoryNamesButton" type="button">初期状態に戻す</button>
                </div>
                <p id="categoryStatus" class="import-status" aria-live="polite"></p>
              </section>
            </div>
            <div class="tool-dropdown">
              <button id="toggleDeleteModeButton" type="button">まとめて削除</button>
              <section id="deletePanel" class="editor-panel hidden" aria-label="まとめて削除">
                <p class="helper">削除した問題はこの端末では非表示になります。必要な場合は削除を全解除できます。</p>
                <div class="editor-actions">
                  <button id="selectVisibleButton" type="button">表示中を全選択</button>
                  <button id="deleteSelectedButton" class="primary" type="button">選択した問題を削除</button>
                  <button id="restoreDeletedButton" type="button">削除を全解除</button>
                </div>
                <p class="filter-title">カテゴリごとに削除</p>
                <div class="editor-actions">
                  <button id="deleteSelectedCategoriesButton" class="primary" type="button">選択したカテゴリを削除</button>
                  <button id="clearSelectedCategoriesButton" type="button">カテゴリ選択を解除</button>
                </div>
                <div id="categoryDeleteList" class="category-delete-list"></div>
                <p id="deleteStatus" class="import-status" aria-live="polite"></p>
              </section>
            </div>
          </section>
          <div id="listItems" class="list"></div>
        </section>

        <section id="importPanel" class="import-panel" aria-label="問題データ追加">
          <details id="importDetails">
            <summary>ファイルから問題を追加</summary>
            <div class="import-panel-body">
              <input id="fileInput" type="file" accept=".json,.js,.csv,.md,.markdown,.txt,.html,.htm,.pdf,application/pdf" multiple>
              <label for="fileKind">ファイルの種類</label>
              <select id="fileKind">
                <option value="quiz">小テスト</option>
                <option value="slides">授業スライド</option>
                <option value="manual">手入力データ</option>
              </select>
              <label for="importCategory">追加先</label>
              <select id="importCategory">
                <option value="quiz">小テスト問題</option>
                <option value="prediction">予想問題</option>
              </select>
              <textarea id="pasteInput" placeholder="ここに Q: 問題 / A: 答え の形式や、CSV・Markdown表を貼り付けても追加できます"></textarea>
              <button id="pasteButton" type="button">貼り付け内容を追加</button>
              <button id="clearImportedButton" type="button">追加データを削除</button>

      function categoryRank(category) {
        const order = orderedCategories(unique([...categoryOrder, ...defaultCategoryOrder, ...allQuestions.map((question) => question.category)]));
        const index = order.indexOf(category);
        return index === -1 ? order.length : index;
      }

      function sourceRank(source) {
        const value = String(source || "");
        if (value.includes("中間過去問")) return 0;
        if (value.includes("過去問")) return 1;
        if (value.includes("小テスト")) return 2;
        if (value.includes("予想")) return 3;
        return 4;
      }

      function sortedQuestionIndexes() {
        return allQuestions
          .map((question, index) => ({ question, index }))
          .sort((a, b) => {
            const categoryDiff = categoryRank(a.question.category) - categoryRank(b.question.category);
            if (categoryDiff) return categoryDiff;
            const sourceRankDiff = sourceRank(a.question.source) - sourceRank(b.question.source);
            if (sourceRankDiff) return sourceRankDiff;
            const sourceDiff = String(a.question.source).localeCompare(String(b.question.source), "ja", { numeric: true });
            if (sourceDiff) return sourceDiff;
            const numberDiff = Number(a.question.number || 0) - Number(b.question.number || 0);
            if (numberDiff) return numberDiff;
            return String(a.question.id).localeCompare(String(b.question.id), "ja", { numeric: true });
          })
          .map((item) => item.index);
      }
