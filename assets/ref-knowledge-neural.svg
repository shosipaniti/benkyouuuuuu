<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">ニューラルネットワークとパーセプトロンの参考図</title>
  <desc id="desc">入力層、中間層、出力層を持つニューラルネットワークとパーセプトロンの関係。</desc>
  <rect width="720" height="420" fill="#fbfaf6"/>
  <text x="34" y="52" font-family="sans-serif" font-size="25" font-weight="700" fill="#272b2c">パーセプトロンから多層ネットワークへ</text>
  <g stroke="#9ccac3" stroke-width="3">
    <path d="M160 128 L350 110 M160 128 L350 190 M160 128 L350 270"/>
    <path d="M160 212 L350 110 M160 212 L350 190 M160 212 L350 270"/>
    <path d="M160 296 L350 110 M160 296 L350 190 M160 296 L350 270"/>
    <path d="M350 110 L560 196 M350 190 L560 196 M350 270 L560 196"/>
  </g>
  <g fill="#e7f2ee" stroke="#2f6f73" stroke-width="3">
    <circle cx="160" cy="128" r="26"/><circle cx="160" cy="212" r="26"/><circle cx="160" cy="296" r="26"/>
    <circle cx="350" cy="110" r="26"/><circle cx="350" cy="190" r="26"/><circle cx="350" cy="270" r="26"/>
    <circle cx="560" cy="196" r="30"/>
  </g>
  <g font-family="sans-serif" font-size="17" fill="#24302f" text-anchor="middle">
    <text x="160" y="354">入力</text>
    <text x="350" y="354">中間層</text>
    <text x="560" y="354">出力</text>
  </g>
  <rect x="430" y="78" width="218" height="54" rx="10" fill="#fbe7df" stroke="#e47c5d"/>
  <text x="539" y="111" font-family="sans-serif" font-size="17" text-anchor="middle" fill="#24302f">層を増やすと深層学習</text>
  <text x="54" y="96" font-family="sans-serif" font-size="16" fill="#5b6663">単純なニューロンモデルがパーセプトロン</text>
</svg>
