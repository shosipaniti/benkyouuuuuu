<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">声道と音声生成の参考図</title>
  <desc id="desc">声帯振動、喉頭腔、咽頭腔、口腔、鼻腔の関係を示す簡略図。</desc>
  <rect width="720" height="420" fill="#f8faf7"/>
  <text x="36" y="52" font-family="sans-serif" font-size="26" font-weight="700" fill="#24302f">声道の4つの腔と音の通り道</text>
  <path d="M180 306 C170 250 178 206 218 178 C252 154 292 156 326 172 C364 190 392 186 426 154 C456 126 500 114 548 122" fill="none" stroke="#2f6f73" stroke-width="24" stroke-linecap="round"/>
  <path d="M250 278 C284 246 324 236 372 246 C418 256 466 250 526 226" fill="none" stroke="#9ccac3" stroke-width="20" stroke-linecap="round"/>
  <path d="M470 174 C506 164 546 166 598 184" fill="none" stroke="#9ccac3" stroke-width="18" stroke-linecap="round"/>
  <circle cx="178" cy="310" r="24" fill="#e47c5d"/>
  <text x="122" y="354" font-family="sans-serif" font-size="18" fill="#24302f">声帯振動</text>
  <text x="218" y="322" font-family="sans-serif" font-size="18" fill="#24302f">喉頭腔</text>
  <text x="318" y="282" font-family="sans-serif" font-size="18" fill="#24302f">咽頭腔</text>
  <text x="430" y="256" font-family="sans-serif" font-size="18" fill="#24302f">口腔</text>
  <text x="528" y="166" font-family="sans-serif" font-size="18" fill="#24302f">鼻腔</text>
  <path d="M116 310 H76" stroke="#e47c5d" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="40" y="292" font-family="sans-serif" font-size="16" fill="#5b6663">呼気</text>
  <path d="M548 122 C594 128 632 150 652 184" fill="none" stroke="#2f6f73" stroke-width="10" stroke-linecap="round"/>
  <text x="466" y="344" font-family="sans-serif" font-size="16" fill="#5b6663">声道形状が共鳴・反共鳴を作り、音色に影響する</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#e47c5d"/>
    </marker>
  </defs>
</svg>
