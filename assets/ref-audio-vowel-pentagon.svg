<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">母音配置の参考図</title>
  <desc id="desc">2つの軸で母音の配置を示した簡略図。</desc>
  <rect width="720" height="420" fill="#f8faf7"/>
  <text x="34" y="52" font-family="sans-serif" font-size="25" font-weight="700" fill="#24302f">母音配置の参考図</text>
  <line x1="112" y1="328" x2="610" y2="328" stroke="#4d5657" stroke-width="2"/>
  <line x1="112" y1="328" x2="112" y2="92" stroke="#4d5657" stroke-width="2"/>
  <text x="570" y="356" font-family="sans-serif" font-size="17" fill="#5b6663">軸2</text>
  <text x="70" y="104" font-family="sans-serif" font-size="17" fill="#5b6663">軸1</text>
  <polygon points="188,130 482,142 560,246 350,310 202,242" fill="#dceee8" stroke="#2f6f73" stroke-width="4"/>
  <g font-family="sans-serif" font-size="24" font-weight="700" fill="#24302f">
    <text x="176" y="122">i</text>
    <text x="476" y="132">u</text>
    <text x="554" y="238">o</text>
    <text x="344" y="306">a</text>
    <text x="190" y="238">e</text>
  </g>
  <path d="M188 130 L138 92" stroke="#e47c5d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="142" y="84" font-family="sans-serif" font-size="16" fill="#5b6663">発音位置の参考</text>
  <text x="372" y="372" font-family="sans-serif" font-size="16" fill="#5b6663">発話の仕方で配置の広がりが変わる</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#e47c5d"/>
    </marker>
  </defs>
</svg>
