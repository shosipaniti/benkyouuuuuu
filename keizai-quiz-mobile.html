<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>経済 小テスト 一問一答</title>
    <style>
:root {
  color-scheme: light;
  --bg: #f6f4ee;
  --surface: #ffffff;
  --surface-2: #edf5f1;
  --ink: #1f2623;
  --muted: #66706b;
  --line: #d8ded8;
  --accent: #146c5f;
  --accent-2: #b85f2d;
  --accent-3: #2e5d92;
  --shadow: 0 18px 42px rgba(31, 38, 35, 0.12);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "YuGothic", "Segoe UI", sans-serif;
  line-height: 1.6;
}

button,
input {
  font: inherit;
}

button {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  min-height: 42px;
  padding: 0 14px;
  cursor: pointer;
}

button:hover {
  border-color: var(--accent);
}

button.is-active,
button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.app-header {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 24px;
  padding: 28px clamp(18px, 4vw, 48px) 18px;
  border-bottom: 1px solid var(--line);
}

.eyebrow {
  margin: 0 0 2px;
  color: var(--accent-2);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-size: clamp(1.55rem, 3vw, 2.35rem);
  line-height: 1.15;
  letter-spacing: 0;
}

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}

.stats span,
.card-meta span {
  display: inline-flex;
  align-items: center;
  min-height: 30px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  padding: 4px 10px;
  color: var(--muted);
  font-size: 0.86rem;
  white-space: nowrap;
}

.layout {
  display: grid;
  grid-template-columns: minmax(230px, 280px) 1fr;
  gap: 24px;
  padding: 24px clamp(18px, 4vw, 48px) 42px;
}

.sidebar {
  align-self: start;
  position: sticky;
  top: 18px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
}

.search-label,
.filter-group h2 {
  display: block;
  margin: 0 0 8px;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--muted);
}

#searchInput {
  width: 100%;
  min-height: 42px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  color: var(--ink);
}

.filter-group {
  margin-top: 20px;
}

.chip-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip-list button {
  min-height: 34px;
  padding: 0 10px;
  font-size: 0.9rem;
}

.workspace {
  min-width: 0;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 18px;
}

.segmented {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  background: var(--surface);
}

.segmented button {
  border: 0;
  border-radius: 0;
  min-width: 96px;
}

.toolbar-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}

.quiz-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow);
  padding: clamp(18px, 4vw, 34px);
}

.card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 18px;
}

.image-frame {
  display: none;
  margin-bottom: 18px;
}

.image-frame.has-image {
  display: grid;
  gap: 12px;
}

.image-frame img {
  width: min(100%, 680px);
  max-height: 420px;
  object-fit: contain;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
}

.question-text {
  margin: 0;
  white-space: pre-line;
  font-size: clamp(1.08rem, 2vw, 1.35rem);
  line-height: 1.8;
}

.choices {
  display: grid;
  gap: 8px;
  margin-top: 20px;
}

.choice,
.choice-button {
  border-left: 4px solid var(--accent-3);
  background: #f5f8fb;
  border-radius: 6px;
  padding: 8px 10px;
  color: #243346;
  text-align: left;
  min-height: 44px;
}

.choice-button {
  border: 1px solid #c9d7e8;
  border-left-width: 4px;
}

.choice-button.is-selected {
  background: #dcecf7;
  border-color: var(--accent-3);
  color: #183759;
  font-weight: 700;
}

.choice-button.compact {
  min-height: 36px;
  padding: 6px 10px;
  font-size: 0.92rem;
}

.matching-row {
  display: grid;
  grid-template-columns: 56px 1fr;
  gap: 10px;
  align-items: start;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  background: #fbfcfb;
}

.matching-label {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 36px;
  border-radius: 6px;
  background: var(--surface-2);
  color: var(--accent);
  font-weight: 700;
}

.matching-options {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.answer-input {
  width: 100%;
  min-height: 46px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 1rem;
}

.judge-button {
  justify-self: start;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.48;
}

.feedback-panel {
  margin-top: 18px;
  border-radius: 8px;
  padding: 12px 14px;
}

.feedback-panel strong,
.feedback-panel span {
  display: block;
}

.feedback-panel strong {
  font-size: 1.05rem;
}

.feedback-panel span {
  margin-top: 2px;
}

.feedback-panel.is-correct {
  border: 1px solid #b7d8c3;
  background: #edf8f0;
  color: #1e5d35;
}

.feedback-panel.is-wrong {
  border: 1px solid #efc1b6;
  background: #fff0ec;
  color: #8a3b28;
}

.answer-panel {
  margin-top: 24px;
  border-left: 5px solid var(--accent-2);
  border-radius: 6px;
  background: #fff7f0;
  padding: 14px 16px;
}

.answer-panel span {
  display: block;
  color: var(--accent-2);
  font-size: 0.78rem;
  font-weight: 700;
}

.answer-panel strong {
  display: block;
  margin-top: 4px;
  font-size: clamp(1.1rem, 2vw, 1.45rem);
  line-height: 1.55;
  white-space: pre-line;
}

.card-actions {
  display: grid;
  grid-template-columns: 42px minmax(124px, 1fr) minmax(96px, auto) minmax(82px, auto) 42px;
  gap: 8px;
  margin-top: 26px;
}

.icon-button {
  width: 42px;
  padding: 0;
  font-size: 1.2rem;
}

.question-list {
  display: grid;
  gap: 12px;
}

.list-item {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  padding: 16px;
}

.list-item summary {
  cursor: pointer;
  font-weight: 700;
}

.list-item p {
  margin: 12px 0 0;
  white-space: pre-line;
}

.list-image {
  display: block;
  width: min(100%, 520px);
  max-height: 320px;
  object-fit: contain;
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
}

.list-answer {
  color: var(--accent);
  font-weight: 700;
}

.empty {
  padding: 28px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--muted);
}

@media (max-width: 820px) {
  .app-header {
    align-items: start;
    flex-direction: column;
  }

  .layout {
    grid-template-columns: 1fr;
  }

  .sidebar {
    position: static;
  }

  .toolbar {
    align-items: stretch;
    flex-direction: column;
  }

  .segmented,
  .toolbar-actions {
    width: 100%;
  }

  .segmented button,
  .toolbar-actions button {
    flex: 1;
  }

  .card-actions {
    grid-template-columns: 42px 1fr 42px;
  }

  #knownBtn,
  #reviewBtn {
    grid-column: span 3;
  }
}

    </style>
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Economics quiz deck</p>
        <h1>経済 小テスト 一問一答</h1>
      </div>
      <div class="stats" aria-live="polite">
        <span id="totalCount">0問</span>
        <span id="knownCount">0習得</span>
        <span id="reviewCount">0復習</span>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar" aria-label="問題フィルター">
        <label class="search-label" for="searchInput">検索</label>
        <input id="searchInput" type="search" placeholder="語句・答えで検索">

        <div class="filter-group">
          <h2>問題区分</h2>
          <div id="kindFilters" class="chip-list"></div>
        </div>

        <div class="filter-group">
          <h2>範囲</h2>
          <div id="sourceFilters" class="chip-list"></div>
        </div>

        <div class="filter-group">
          <h2>形式</h2>
          <div id="typeFilters" class="chip-list"></div>
        </div>

        <div class="filter-group">
          <h2>進捗</h2>
          <div id="statusFilters" class="chip-list"></div>
        </div>
      </aside>

      <section class="workspace">
        <div class="toolbar" aria-label="表示切替">
          <div class="segmented">
            <button id="quizModeBtn" class="is-active" type="button">一問一答</button>
            <button id="listModeBtn" type="button">一覧</button>
          </div>
          <div class="toolbar-actions">
            <button id="shuffleBtn" type="button">シャッフル</button>
            <button id="resetProgressBtn" type="button">進捗リセット</button>
          </div>
        </div>

        <section id="quizView" class="quiz-view" aria-live="polite">
          <article class="quiz-card">
            <div class="card-meta">
              <span id="cardSource"></span>
              <span id="cardType"></span>
              <span id="cardPosition"></span>
            </div>
            <div id="imageFrame" class="image-frame"></div>
            <p id="questionText" class="question-text"></p>
            <div id="choiceList" class="choices"></div>
            <div id="feedbackPanel" class="feedback-panel" hidden>
              <strong id="feedbackTitle"></strong>
              <span id="feedbackDetail"></span>
            </div>
            <div id="answerPanel" class="answer-panel" hidden>
              <span>答え</span>
              <strong id="answerText"></strong>
            </div>
            <div class="card-actions">
              <button id="prevBtn" class="icon-button" type="button" aria-label="前の問題">←</button>
              <button id="revealBtn" class="primary" type="button">答えを見る</button>
              <button id="knownBtn" type="button">分かった</button>
              <button id="reviewBtn" type="button">復習</button>
              <button id="nextBtn" class="icon-button" type="button" aria-label="次の問題">→</button>
            </div>
          </article>
        </section>

        <section id="listView" class="list-view" hidden>
          <div id="questionList" class="question-list"></div>
        </section>
      </section>
    </main>

    <script>
const quizQuestions = (window.QUESTION_DATA || []).map((question) => ({
  category: "quiz",
  ...question
}));
const predictedQuestions = (window.PREDICTED_QUESTION_DATA || []).map((question) => ({
  category: "prediction",
  ...question
}));
const questions = [...quizQuestions, ...predictedQuestions];
const storageKey = "economics-quiz-progress-v1";

const typeLabels = {
  single: "選択",
  multiple: "複数選択",
  matching: "対応",
  text: "入力",
  free: "自由記述"
};

const categoryLabels = {
  quiz: "小テスト問題",
  prediction: "予想問題"
};

const state = {
  kind: "all",
  source: "all",
  type: "all",
  status: "all",
  query: "",
  mode: "quiz",
  index: 0,
  revealed: false,
  order: questions.map((_, index) => index),
  progress: loadProgress(),
  responses: {}
};

const els = {
  totalCount: document.getElementById("totalCount"),
  knownCount: document.getElementById("knownCount"),
  reviewCount: document.getElementById("reviewCount"),
  kindFilters: document.getElementById("kindFilters"),
  sourceFilters: document.getElementById("sourceFilters"),
  typeFilters: document.getElementById("typeFilters"),
  statusFilters: document.getElementById("statusFilters"),
  searchInput: document.getElementById("searchInput"),
  quizModeBtn: document.getElementById("quizModeBtn"),
  listModeBtn: document.getElementById("listModeBtn"),
  shuffleBtn: document.getElementById("shuffleBtn"),
  resetProgressBtn: document.getElementById("resetProgressBtn"),
  quizView: document.getElementById("quizView"),
  listView: document.getElementById("listView"),
  cardSource: document.getElementById("cardSource"),
  cardType: document.getElementById("cardType"),
  cardPosition: document.getElementById("cardPosition"),
  imageFrame: document.getElementById("imageFrame"),
  questionText: document.getElementById("questionText"),
  choiceList: document.getElementById("choiceList"),
  feedbackPanel: document.getElementById("feedbackPanel"),
  feedbackTitle: document.getElementById("feedbackTitle"),
  feedbackDetail: document.getElementById("feedbackDetail"),
  answerPanel: document.getElementById("answerPanel"),
  answerText: document.getElementById("answerText"),
  prevBtn: document.getElementById("prevBtn"),
  revealBtn: document.getElementById("revealBtn"),
  knownBtn: document.getElementById("knownBtn"),
  reviewBtn: document.getElementById("reviewBtn"),
  nextBtn: document.getElementById("nextBtn"),
  questionList: document.getElementById("questionList")
};

function loadProgress() {
  try {
    return JSON.parse(localStorage.getItem(storageKey)) || {};
  } catch {
    return {};
  }
}

function saveProgress() {
  localStorage.setItem(storageKey, JSON.stringify(state.progress));
}

function parseMatchingAnswer(answer) {
  return answer.split("/")
    .map((part) => part.trim())
    .filter(Boolean)
    .map((part) => {
      const [label, value] = part.split("=").map((item) => item.trim());
      return { label, value };
    });
}

function parseMatchingChoices(choices) {
  return choices.map((choice) => {
    const match = choice.match(/^([^:]+):\s*(.*)$/);
    return match ? { key: match[1], label: match[2] } : { key: choice, label: choice };
  });
}

function getResponse(question) {
  if (!state.responses[question.id]) {
    state.responses[question.id] = { selected: [], matching: {}, text: "", checked: false, correct: false };
  }
  return state.responses[question.id];
}

function correctValues(question) {
  if (question.type === "matching") {
    return parseMatchingAnswer(question.answer).map((item) => item.value);
  }
  if (question.type === "multiple") {
    return question.answer.split("/").map((item) => item.trim()).filter(Boolean);
  }
  return [question.answer.trim()];
}

function normalizeAnswer(value) {
  return value.toString().trim().replace(/\s+/g, "").toLowerCase();
}

function arraysEqual(a, b) {
  return a.length === b.length && a.every((item) => b.includes(item));
}

function judge(question) {
  const response = getResponse(question);
  let correct = false;

  if (question.type === "matching") {
    const pairs = parseMatchingAnswer(question.answer);
    correct = pairs.every((pair) => response.matching[pair.label] === pair.value);
  } else if (question.type === "multiple") {
    correct = arraysEqual(
      response.selected.map(normalizeAnswer).sort(),
      correctValues(question).map(normalizeAnswer).sort()
    );
  } else if (question.type === "text" || question.type === "free") {
    correct = normalizeAnswer(response.text) === normalizeAnswer(question.answer);
  } else {
    correct = normalizeAnswer(response.selected[0] || "") === normalizeAnswer(question.answer);
  }

  response.checked = true;
  response.correct = correct;
  if (correct) {
    state.progress[question.id] = "known";
  } else {
    state.progress[question.id] = "review";
  }
  saveProgress();
  render();
}

function unique(values) {
  return [...new Set(values)];
}

function filteredQuestions() {
  const query = state.query.trim().toLowerCase();
  return state.order
    .map((index) => questions[index])
    .filter((question) => {
      const status = state.progress[question.id] || "new";
      const text = `${question.prompt} ${question.answer} ${question.source}`.toLowerCase();
      return (state.kind === "all" || question.category === state.kind)
        && (state.source === "all" || question.source === state.source)
        && (state.type === "all" || question.type === state.type)
        && (state.status === "all" || status === state.status)
        && (!query || text.includes(query));
    });
}

function makeButton(label, active, onClick) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = label;
  button.className = active ? "is-active" : "";
  button.addEventListener("click", onClick);
  return button;
}

function renderFilters() {
  const categories = [
    ["all", "すべて"],
    ["quiz", "小テスト問題"],
    ["prediction", "予想問題"]
  ];
  els.kindFilters.replaceChildren(
    ...categories.map(([value, label]) =>
      makeButton(label, state.kind === value, () => {
        state.kind = value;
        state.source = "all";
        state.index = 0;
        state.revealed = false;
        render();
      })
    )
  );

  const sources = unique(questions
    .filter((question) => state.kind === "all" || question.category === state.kind)
    .map((q) => q.source));

  els.sourceFilters.replaceChildren(
    makeButton("すべて", state.source === "all", () => setFilter("source", "all")),
    ...sources.map((source) =>
      makeButton(source, state.source === source, () => setFilter("source", source))
    )
  );

  els.typeFilters.replaceChildren(
    makeButton("すべて", state.type === "all", () => setFilter("type", "all")),
    ...unique(questions.map((q) => q.type)).map((type) =>
      makeButton(typeLabels[type] || type, state.type === type, () => setFilter("type", type))
    )
  );

  const statuses = [
    ["all", "すべて"],
    ["new", "未着手"],
    ["known", "習得"],
    ["review", "復習"]
  ];
  els.statusFilters.replaceChildren(
    ...statuses.map(([value, label]) =>
      makeButton(label, state.status === value, () => setFilter("status", value))
    )
  );
}

function setFilter(key, value) {
  state[key] = value;
  state.index = 0;
  state.revealed = false;
  render();
}

function renderStats(items) {
  const known = questions.filter((q) => state.progress[q.id] === "known").length;
  const review = questions.filter((q) => state.progress[q.id] === "review").length;
  els.totalCount.textContent = `${items.length}/${questions.length}問`;
  els.knownCount.textContent = `${known}習得`;
  els.reviewCount.textContent = `${review}復習`;
}

function renderQuiz(items) {
  const card = els.quizView.querySelector(".quiz-card");
  let empty = document.getElementById("quizEmpty");

  if (!items.length) {
    if (card) card.hidden = true;
    if (!empty) {
      empty = document.createElement("div");
      empty.id = "quizEmpty";
      empty.className = "empty";
      empty.textContent = "条件に合う問題がありません。";
      els.quizView.appendChild(empty);
    }
    return;
  }

  if (card) card.hidden = false;
  if (empty) empty.remove();

  if (state.index >= items.length) state.index = 0;
  const question = items[state.index];
  const progress = state.progress[question.id] || "new";
  const response = getResponse(question);

  els.cardSource.textContent = question.source;
  els.cardType.textContent = `${categoryLabels[question.category]} / ${typeLabels[question.type] || question.type}`;
  els.cardPosition.textContent = `${state.index + 1} / ${items.length}`;
  els.questionText.textContent = question.prompt;
  els.answerText.textContent = question.answer || "解答なし";
  els.answerPanel.hidden = !state.revealed;
  els.feedbackPanel.hidden = !response.checked;
  els.feedbackPanel.className = `feedback-panel ${response.correct ? "is-correct" : "is-wrong"}`;
  els.feedbackTitle.textContent = response.correct ? "正解" : "不正解";
  els.feedbackDetail.textContent = response.correct ? "その調子です。" : `正解: ${question.answer}`;
  els.revealBtn.textContent = state.revealed ? "答えを隠す" : "答えを見る";
  els.knownBtn.className = progress === "known" ? "is-active" : "";
  els.reviewBtn.className = progress === "review" ? "is-active" : "";

  els.imageFrame.replaceChildren();
  question.images.forEach((src) => {
    const img = document.createElement("img");
    img.src = src;
    img.alt = `${question.source}の図`;
    els.imageFrame.appendChild(img);
  });
  els.imageFrame.classList.toggle("has-image", question.images.length > 0);

  els.choiceList.replaceChildren();
  renderInteraction(question, response);
}

function renderInteraction(question, response) {
  if (question.type === "single") {
    question.choices.forEach((choice) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = `choice-button ${response.selected.includes(choice) ? "is-selected" : ""}`;
      button.textContent = choice;
      button.addEventListener("click", () => {
        response.selected = [choice];
        judge(question);
      });
      els.choiceList.appendChild(button);
    });
    return;
  }

  if (question.type === "multiple") {
    question.choices.forEach((choice) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = `choice-button ${response.selected.includes(choice) ? "is-selected" : ""}`;
      button.textContent = choice;
      button.addEventListener("click", () => {
        response.checked = false;
        response.selected = response.selected.includes(choice)
          ? response.selected.filter((item) => item !== choice)
          : [...response.selected, choice];
        render();
      });
      els.choiceList.appendChild(button);
    });
    els.choiceList.appendChild(makeJudgeButton(question, response.selected.length === 0));
    return;
  }

  if (question.type === "matching") {
    const choices = parseMatchingChoices(question.choices);
    parseMatchingAnswer(question.answer).forEach((pair) => {
      const row = document.createElement("div");
      row.className = "matching-row";

      const label = document.createElement("span");
      label.className = "matching-label";
      label.textContent = pair.label;
      row.appendChild(label);

      const buttons = document.createElement("div");
      buttons.className = "matching-options";
      choices.forEach((choice) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `choice-button compact ${response.matching[pair.label] === choice.label ? "is-selected" : ""}`;
        button.textContent = choice.label;
        button.addEventListener("click", () => {
          response.checked = false;
          response.matching[pair.label] = choice.label;
          render();
        });
        buttons.appendChild(button);
      });
      row.appendChild(buttons);
      els.choiceList.appendChild(row);
    });
    const complete = parseMatchingAnswer(question.answer).every((pair) => response.matching[pair.label]);
    els.choiceList.appendChild(makeJudgeButton(question, !complete));
    return;
  }

  const input = document.createElement("input");
  input.className = "answer-input";
  input.type = "text";
  input.value = response.text;
  input.placeholder = question.type === "free" ? "自分の答えを入力" : "答えを入力";
  input.addEventListener("input", (event) => {
    response.checked = false;
    response.text = event.target.value;
  });
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && response.text.trim()) judge(question);
  });
  els.choiceList.appendChild(input);
  els.choiceList.appendChild(makeJudgeButton(question, !response.text.trim() || question.answer.includes("保存された解答なし")));
}

function makeJudgeButton(question, disabled) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "primary judge-button";
  button.disabled = disabled;
  button.textContent = "判定する";
  button.addEventListener("click", () => judge(question));
  return button;
}

function renderList(items) {
  if (!items.length) {
    els.questionList.innerHTML = '<div class="empty">条件に合う問題がありません。</div>';
    return;
  }

  els.questionList.replaceChildren(...items.map((question) => {
    const detail = document.createElement("details");
    detail.className = "list-item";

    const summary = document.createElement("summary");
    summary.textContent = `${categoryLabels[question.category]} / ${question.source} / ${typeLabels[question.type] || question.type} / ${question.prompt.split("\n")[0]}`;
    detail.appendChild(summary);

    question.images.forEach((src) => {
      const img = document.createElement("img");
      img.src = src;
      img.alt = `${question.source}の図`;
      img.className = "list-image";
      detail.appendChild(img);
    });

    const prompt = document.createElement("p");
    prompt.textContent = question.prompt;
    detail.appendChild(prompt);

    if (question.choices.length) {
      const choices = document.createElement("p");
      choices.textContent = `選択肢: ${question.choices.join(" / ")}`;
      detail.appendChild(choices);
    }

    const answer = document.createElement("p");
    answer.className = "list-answer";
    answer.textContent = `答え: ${question.answer}`;
    detail.appendChild(answer);

    return detail;
  }));
}

function renderMode() {
  const quiz = state.mode === "quiz";
  els.quizView.hidden = !quiz;
  els.listView.hidden = quiz;
  els.quizModeBtn.classList.toggle("is-active", quiz);
  els.listModeBtn.classList.toggle("is-active", !quiz);
}

function render() {
  const items = filteredQuestions();
  renderFilters();
  renderStats(items);
  renderMode();
  if (state.mode === "quiz") renderQuiz(items);
  renderList(items);
}

function move(delta) {
  const count = filteredQuestions().length;
  if (!count) return;
  state.index = (state.index + delta + count) % count;
  state.revealed = false;
  render();
}

function mark(status) {
  const current = filteredQuestions()[state.index];
  if (!current) return;
  if (state.progress[current.id] === status) {
    delete state.progress[current.id];
  } else {
    state.progress[current.id] = status;
  }
  saveProgress();
  render();
}

els.searchInput.addEventListener("input", (event) => {
  state.query = event.target.value;
  state.index = 0;
  state.revealed = false;
  render();
});

els.quizModeBtn.addEventListener("click", () => {
  state.mode = "quiz";
  render();
});

els.listModeBtn.addEventListener("click", () => {
  state.mode = "list";
  render();
});

els.shuffleBtn.addEventListener("click", () => {
  state.order = state.order
    .map((value) => [Math.random(), value])
    .sort((a, b) => a[0] - b[0])
    .map((pair) => pair[1]);
  state.index = 0;
  state.revealed = false;
  render();
});

els.resetProgressBtn.addEventListener("click", () => {
  state.progress = {};
  saveProgress();
  render();
});

els.prevBtn.addEventListener("click", () => move(-1));
els.nextBtn.addEventListener("click", () => move(1));
els.revealBtn.addEventListener("click", () => {
  state.revealed = !state.revealed;
  render();
});
els.knownBtn.addEventListener("click", () => mark("known"));
els.reviewBtn.addEventListener("click", () => mark("review"));

document.addEventListener("keydown", (event) => {
  if (event.target.matches("input")) return;
  if (event.key === "ArrowRight") move(1);
  if (event.key === "ArrowLeft") move(-1);
  if (event.key === " ") {
    event.preventDefault();
    state.revealed = !state.revealed;
    render();
  }
});

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {
      // The quiz still works online if service worker registration is unavailable.
    });
  });
}
